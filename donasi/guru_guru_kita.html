<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Guru Guru Kita</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f8;
}
.header{
  background:#2e7d32;
  color:#fff;
  padding:20px;
  text-align:center;
}
.header h1{
  margin:0;
  font-size:24px;
}
.header p{
  margin:4px 0 0;
  opacity:.9;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,220px);
  gap:20px;
  justify-content:center;
}

.card{
  background:#fff;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
  text-align:center;
  padding:14px;
  transition:.2s;
}
.card:hover{
  transform:translateY(-4px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
}

.nama{
  font-weight:bold;
  margin-top:10px;
  font-size:15px;
}

.ket{
  font-size:13px;
  color:#555;
  margin-top:4px;
}

.footer{
  text-align:center;
  padding:20px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="header">
  <h1>Guru Guru Kita</h1>
  <p>SDN Sidobandung II</p>
</div>

<div class="container" id="listGuru">
  <div style="grid-column:1/-1;text-align:center;color:#777">
    Memuat data...
  </div>
</div>

<div class="footer">
  © SDN Sidobandung II
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  orderBy,
  onSnapshot
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ===== FIREBASE ===== */
const app = initializeApp({
  apiKey:"AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain:"datasiswa-c10f4.firebaseapp.com",
  projectId:"datasiswa-c10f4"
});
const db = getFirestore(app);

const listGuru = document.getElementById("listGuru");

/* ===== LOAD DATA PUBLIK ===== */
const q = query(
  collection(db,"Guru_guru_kita"),
  where("tampil","==",true),
  orderBy("urutan","asc")
);


function driveThumbnail(url){
  if(!url) return "";

  // file/d/ID
  let idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);

  // open?id=ID atau uc?id=ID
  if(!idMatch){
    idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  }

  // kalau tetap tidak ketemu, kembalikan url asli
  if(!idMatch) return url;

  const fileId = idMatch[1];
  return `https://drive.google.com/thumbnail?id=${fileId}&sz=w600`;
}


onSnapshot(q,(snap)=>{
  if(snap.empty){
    listGuru.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;color:#777">
        Data belum tersedia
      </div>`;
    return;
  }

  let html = "";
  snap.forEach(d=>{
  const x = d.data();
  html += `
    <div class="card">
      <img src="${driveThumbnail(x.fotoUrl)}"
           onerror="this.src='https://via.placeholder.com/300x220?text=No+Photo'">
      <div class="nama">${x.nama}</div>
      <div class="ket">${x.keterangan || ""}</div>
    </div>
  `;
});

  listGuru.innerHTML = html;
});
</script>

</body>
</html>
