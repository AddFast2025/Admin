<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dokumentasi Kegiatan Sekolah</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  padding:20px
}
.card{
  max-width:520px;
  margin:auto;
  background:#fff;
  padding:14px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.15)
}
h2{text-align:center;margin-bottom:4px}
h3{text-align:center;margin-top:0;color:#555}
label{font-weight:bold;margin-top:12px;display:block}
input,textarea,button{
  width:100%;
  padding:10px;
  margin-top:6px;
  font-size:14px
}
textarea{resize:vertical}
button{
  background:#1565c0;
  color:#fff;
  border:none;
  border-radius:8px;
  margin-top:18px;
  cursor:pointer
}
button:disabled{background:#aaa}
#notif{
  margin-top:5px;
  text-align:center;
  font-weight:bold
}
#previewBox{
  margin-top:10px;
  text-align:center;
  display:none
}
#previewImg{
  width:220px;
  border-radius:8px;
  border:1px solid #ddd;
  box-shadow:0 1px 4px rgba(0,0,0,.2)
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  table-layout:fixed
}
th,td{
  border:1px solid #ddd;
  padding:6px;
  word-wrap:break-word
}
th{background:#e3f2fd}
.action-btn{
  font-size:12px;
  padding:2px 6px;
  margin-bottom:2px;
  cursor:pointer
}
.action-btn.delete{
  color:red;
  font-weight:bold
}
</style>
</head>

<body>

<div class="card">
  <h2>📸 Dokumentasi Kegiatan Sekolah</h2>
  <h3>SDN Sidobandung II</h3>

  <label>Tanggal Kegiatan</label>
  <input type="date" id="tanggal">

  <label>Nama Kegiatan</label>
  <input id="judul" placeholder="Contoh: Kegiatan Pramuka Kelas 5">

  <label>Foto Kegiatan</label>
  <input type="file" id="foto" accept="image/*">

  <div id="previewBox">
    <img id="previewImg">
  </div>

  <label>Deskripsi Kegiatan</label>
  <textarea id="keterangan" rows="4"
    placeholder="Uraian singkat kegiatan..."></textarea>

  <button id="btn">💾 Simpan Dokumentasi</button>
  <div id="notif"></div>
</div>

<hr style="margin:30px 0">

<h3 style="text-align:center">📋 Arsip Dokumentasi Kegiatan</h3>

<table>
  <thead>
    <tr>
      <th style="width:20px">No</th>
      <th style="width:70px">Tanggal</th>
      <th>Nama & Deskripsi Kegiatan</th>
      <th style="width:40px">Aksi</th>
    </tr>
  </thead>
  <tbody id="listProgres">
    <tr>
      <td colspan="4" style="text-align:center;color:#777">
        Memuat data...
      </td>
    </tr>
  </tbody>
</table>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc,
  getDoc,
  deleteDoc
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ===== CONFIG ===== */
const APP_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwDt10ar5OQjreiB0IOuvWqXBwJt6Nxynd1m_GZgt5yntQwApMIU6NAOLIcXz-SKhq-/exec";

const app = initializeApp({
  apiKey:"AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain:"datasiswa-c10f4.firebaseapp.com",
  projectId:"datasiswa-c10f4"
});

const db = getFirestore(app);

/* ===== ELEMENT ===== */
const tanggalEl = document.getElementById("tanggal");
const judulEl = document.getElementById("judul");
const fotoEl = document.getElementById("foto");
const ketEl = document.getElementById("keterangan");
const btn = document.getElementById("btn");
const notif = document.getElementById("notif");
const previewBox = document.getElementById("previewBox");
const previewImg = document.getElementById("previewImg");
const listProgresEl = document.getElementById("listProgres");

/* ===== DEFAULT TANGGAL LOKAL ===== */
const now = new Date();
const localDate = new Date(
  now.getTime() - now.getTimezoneOffset()*60000
).toISOString().split("T")[0];
tanggalEl.value = localDate;

let fotoUrl = "";
let editId = null;

/* ===== PREVIEW FOTO ===== */
fotoEl.addEventListener("change",()=>{
  const file = fotoEl.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    previewImg.src = r.result;
    previewBox.style.display = "block";
  };
  r.readAsDataURL(file);
});

/* ===== UPLOAD ===== */
function toBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function uploadKeDrive(file){
  const fd = new FormData();
  fd.append("name",file.name);
  fd.append("mime",file.type);
  fd.append("data",await toBase64(file));

  const r = await fetch(APP_SCRIPT_URL,{
    method:"POST",
    body:fd
  });
  const j = await r.json();
  return j.url;
}

/* ===== SIMPAN / UPDATE ===== */
btn.onclick = async ()=>{
  const tanggal = tanggalEl.value;
  const judul = judulEl.value.trim();
  const keterangan = ketEl.value.trim();
  const file = fotoEl.files[0];

  if(!tanggal || !judul){
    alert("Tanggal dan nama kegiatan wajib diisi");
    return;
  }

  btn.disabled = true;
  notif.innerHTML = "⏳ Menyimpan dokumentasi...";

  try{
    if(file){
      fotoUrl = await uploadKeDrive(file);
    }

    if(editId){
      await updateDoc(doc(db,"kegiatanSekolah",editId),{
        tanggal,
        judul,
        keterangan
      });
      editId = null;
      btn.innerHTML = "💾 Simpan Dokumentasi";
    }else{
      await addDoc(collection(db,"kegiatanSekolah"),{
        tanggal,
        judul,
        keterangan,
        fotoUrl,
        tampil:true,
        createdAt: serverTimestamp()
      });
    }

    notif.innerHTML = "✅ Dokumentasi tersimpan";
    notif.style.color = "green";

    judulEl.value="";
    ketEl.value="";
    fotoEl.value="";
    previewBox.style.display="none";
    fotoUrl="";

  }catch(e){
    notif.innerHTML="❌ Gagal menyimpan";
    notif.style.color="red";
  }

  btn.disabled=false;
};

/* ===== LOAD DATA ===== */
function loadData(){
  const q = query(
    collection(db,"kegiatanSekolah"),
    orderBy("createdAt","desc")
  );

  onSnapshot(q,(snap)=>{
    if(snap.empty){
      listProgresEl.innerHTML = `
      <tr>
        <td colspan="4" style="text-align:center;color:#777">
          Belum ada dokumentasi
        </td>
      </tr>`;
      return;
    }

    let no = 1;
    let html = "";

    snap.forEach(d=>{
      const x = d.data();
      html += `
      <tr>
        <td>${no}</td>
        <td>${x.tanggal}</td>
        <td>
          <b>${x.judul}</b><br>
          ${x.keterangan || "-"}
        </td>
        <td style="text-align:center">
          <button class="action-btn"
            onclick="editData('${d.id}')">✏️</button><br>
          <button class="action-btn"
            onclick="toggleTampil('${d.id}',${x.tampil!==false})">
            ${x.tampil===false?"🚫":"👁️"}
          </button><br>
          <button class="action-btn delete"
            onclick="hapusData('${d.id}')">🗑️</button>
        </td>
      </tr>`;
      no++;
    });

    listProgresEl.innerHTML = html;
  });
}
loadData();

/* ===== GLOBAL ACTION ===== */
window.editData = async (id)=>{
  const s = await getDoc(doc(db,"kegiatanSekolah",id));
  if(!s.exists()) return;
  const d = s.data();

  tanggalEl.value = d.tanggal;
  judulEl.value = d.judul;
  ketEl.value = d.keterangan || "";
  fotoUrl = d.fotoUrl || "";

  editId = id;
  btn.innerHTML = "💾 Update Dokumentasi";
  window.scrollTo({top:0,behavior:"smooth"});
};

window.toggleTampil = async (id,cur)=>{
  await updateDoc(doc(db,"kegiatanSekolah",id),{
    tampil: !cur
  });
};

window.hapusData = async (id)=>{
  if(!confirm("Yakin ingin menghapus dokumentasi ini?")) return;
  await deleteDoc(doc(db,"kegiatanSekolah",id));
};
</script>

</body>
</html>
