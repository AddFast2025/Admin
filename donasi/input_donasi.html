<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Bakti Almamater</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  padding:20px
}
.card{
  max-width:520px;
  margin:auto;
  background:#fff;
  padding:10px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.15)
}
h2{text-align:center;margin-bottom:15px}
label{font-weight:bold;margin-top:12px;display:block}
select,input,button{
  width:100%;
  padding:10px;
  margin-top:6px;
  font-size:14px
}
button{
  background:#2e7d32;
  color:#fff;
  border:none;
  border-radius:8px;
  margin-top:18px;
  cursor:pointer
}
button:disabled{background:#aaa}
#notif{
  margin-top:15px;
  text-align:center;
  font-weight:bold
}
#previewBox{
  margin-top:10px;
  text-align:center;
  display:none
}
#previewImg{
  width:220px;
  height:auto;
  border-radius:8px;
  border:1px solid #ddd;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<div class="card">
<h2>💝 Bakti Almamater</h2>
<h2>SDN SIDOBANDUNG II</h2>

<!-- STATUS DONATUR -->
<label>Status Donatur</label>

<select id="status">
  <option value="">-- Pilih Status --</option>

  <!-- TAMBAHAN BARU -->
  <option>Orang Tua / Wali Murid</option>
  <option>Kegiatan Tahlil Siswa</option>
  <option>Keluarga SDN Sidobandung II</option>
  <option>Simpatisan / Sponsor</option>
  <option>Titip Kirim Doa</option>

  <option disabled>──────────</option>


  <!-- ALUMNI -->
  <script>
    for(let i=1979;i<=2025;i++){
      document.write(`<option>Alumni Lulusan Tahun ${i}</option>`);
    }
  </script>
</select>




<!-- NAMA -->
<label>Nama Donatur</label>
<input id="nama" placeholder="Nama Lengkap">

<!-- NOMINAL -->
<label>Nominal Donasi (Rp)</label>
<input type="number" id="nominal" placeholder="Contoh: 50000">

<!-- CARA -->
<label>Cara Donasi</label>
<select id="cara">
  <option value="">-- Pilih Cara --</option>
  <option>Transfer</option>
  <option>QRIS</option>
  <option>Tunai</option>
</select>

<!-- BUKTI -->
<label>Bukti Donasi (Opsional)</label>
<input type="file" id="bukti" accept="image/*">

<div id="previewBox">
  <img id="previewImg">
</div>

<button id="btn">Kirim Donasi</button>
<div id="notif"></div>


<div id="ucapan"
     style="display:none;
            margin-top:15px;
            padding:12px;
            background:#f1f8e9;
            border-left:4px solid #2e7d32;
            font-size:14px;
            line-height:1.5">
</div>


</div>


<hr style="margin:25px 0">

<h3 style="text-align:center;margin-bottom:10px">
⏳ Donatur Menunggu Validasi
</h3>

<table id="tabelDonatur"
       style="width:100%;
              border-collapse:collapse;
              font-size:14px">
  <tbody id="listDonatur">
    <tr>
      <td style="text-align:center;color:#777;padding:10px">
        Memuat data...
      </td>
    </tr>
  </tbody>
</table>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  query,
  where,
  orderBy,
  limit,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= CONFIG ================= */

const APP_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwDt10ar5OQjreiB0IOuvWqXBwJt6Nxynd1m_GZgt5yntQwApMIU6NAOLIcXz-SKhq-/exec";

const app = initializeApp({
  apiKey:"AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain:"datasiswa-c10f4.firebaseapp.com",
  projectId:"datasiswa-c10f4"
});

const db = getFirestore(app);

/* ================= ELEMENT ================= */

const statusEl = document.getElementById("status");
const statusLainnyaEl = document.getElementById("statusLainnya");
const namaEl = document.getElementById("nama");
const nominalEl = document.getElementById("nominal");
const caraEl = document.getElementById("cara");
const buktiEl = document.getElementById("bukti");
const previewBox = document.getElementById("previewBox");
const previewImg = document.getElementById("previewImg");
const notif = document.getElementById("notif");
const btn = document.getElementById("btn");

let uploadedBuktiUrl = "";

/* ================= STATUS LAINNYA ================= */

statusEl.addEventListener("change",()=>{
  if(statusEl.value === "Titip Kirim Doa"){
    namaEl.value = "Dari : .......... kirim doa untuk : ..........";
    namaEl.focus();
  } else {
    // kosongkan hanya jika sebelumnya contoh titip doa
    if(namaEl.value.includes("kirim doa untuk")){
      namaEl.value = "";
    }
  }
});


/* ================= PREVIEW SAAT PILIH FILE ================= */

buktiEl.addEventListener("change",()=>{
  const file = buktiEl.files[0];
  if(!file) return;

  if(file.type.startsWith("image/")){
    const reader = new FileReader();
    reader.onload=()=>{
      previewImg.src = reader.result;
      previewBox.style.display="block";
    };
    reader.readAsDataURL(file);
  }
});

function formatRupiah(angka){
  return "Rp " + angka.toLocaleString("id-ID");
}


/* ================= HELPER ================= */

function formatTanggalJam(ts){
  if(!ts) return "-";
  const d = ts.toDate();

  const tgl = d.toLocaleDateString("id-ID",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });

  const jam = d.toLocaleTimeString("id-ID",{
    hour:"2-digit",
    minute:"2-digit"
  });

  return `${tgl} ${jam}`;
}


function toBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(",")[1]);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function uploadKeDrive(file){
  const formData=new FormData();
  formData.append("name",file.name);
  formData.append("mime",file.type);
  formData.append("data",await toBase64(file));

  const res=await fetch(APP_SCRIPT_URL,{
    method:"POST",
    body:formData
  });

  const json=await res.json();
  return json.url;
}

/* ================= SUBMIT ================= */

btn.onclick = async ()=>{
  let status = statusEl.value;
  if(status==="LAINNYA"){
    status = statusLainnyaEl.value.trim();
  }

  const nama = namaEl.value.trim();
  const nominal = Number(nominalEl.value);
  const cara = caraEl.value;
  const file = buktiEl.files[0];

  if(!status || !nama || !nominal || !cara){
    alert("Lengkapi data utama");
    return;
  }

  btn.disabled=true;
  notif.innerHTML="⏳ Mengirim donasi...";

  try{
    if(file && !uploadedBuktiUrl){
      notif.innerHTML="⏳ Upload bukti...";
      uploadedBuktiUrl = await uploadKeDrive(file);
    }

    await addDoc(collection(db,"donasi"),{
      statusDonatur: status,
      nama,
      nominal,
      caraDonasi: cara,
      buktiUrl: uploadedBuktiUrl,
      statusValidasi: "pending",
      createdAt: serverTimestamp()
    });

    notif.innerHTML="✅ Donasi berhasil dikirim";
    notif.style.color="green";

const ucapanEl = document.getElementById("ucapan");

ucapanEl.innerHTML = `
<b>Keluarga Besar SDN Sidobandung II</b> menyampaikan terima kasih kepada
<b>Bapak / Ibu ${nama}</b> <br> atas donasinya sebesar
<b>${formatRupiah(nominal)}</b>.<br>
Semoga menjadi <b>amal jariyah</b> Bapak / Ibu. 🤲
`;

ucapanEl.style.display = "block";



    /* RESET */
    statusEl.value="";
    statusLainnyaEl.value="";
    statusLainnyaEl.style.display="none";
    namaEl.value="";
    nominalEl.value="";
    caraEl.value="";
    buktiEl.value="";
    previewBox.style.display="none";
    previewImg.src="";
    uploadedBuktiUrl="";



  }catch(err){
    console.error(err);
    notif.innerHTML="❌ Gagal mengirim donasi";
    notif.style.color="red";
  }

  btn.disabled=false;
};


const listDonaturEl = document.getElementById("listDonatur");

function tampilkanDonaturPending(){
  const q = query(
    collection(db,"donasi"),
    where("statusValidasi","==","pending"),
    orderBy("createdAt","desc"),
    limit(10) // opsional: batasi 10 terbaru
  );

  onSnapshot(q,(snap)=>{
    if(snap.empty){
      listDonaturEl.innerHTML = `
        <tr>
          <td style="text-align:center;color:#777;padding:10px">
            Belum ada donasi menunggu validasi
          </td>
        </tr>`;
      return;
    }

    let no = 1;
    let html = "";

    snap.forEach(doc=>{
      const d = doc.data();

     html += `
<tr style="border-top:1px solid #ddd">
  <td style="padding:10px">
    <b>${no}. ${formatTanggalJam(d.createdAt)}</b><br>
    ${d.statusDonatur}<br>
    <span style="color:#555">${d.nama}</span><br>
    <span style="color:#2e7d32;font-weight:bold">
      ${formatRupiah(d.nominal)}
    </span>
  </td>
</tr>
`;


      no++;
    });

    listDonaturEl.innerHTML = html;
  });
}

// PANGGIL
tampilkanDonaturPending();


</script>

</body>
</html>
