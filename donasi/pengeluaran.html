<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pengeluaran Dana Donasi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}
.card{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
h2{text-align:center;margin-bottom:15px}

label{font-weight:bold;display:block;margin-top:10px}
input,textarea,button{
  width:100%;
  padding:10px;
  margin-top:6px;
  font-size:14px;
}
textarea{resize:vertical}

button{
  background:#c62828;
  color:#fff;
  border:none;
  border-radius:8px;
  margin-top:15px;
  cursor:pointer;
}

.ringkasan{
  margin-top:20px;
  padding:12px;
  background:#f1f8e9;
  border-left:4px solid #2e7d32;
  font-weight:bold;
  line-height:1.6;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  font-size:14px;
}
th,td{
  border:1px solid #000;
  padding:10px;
  vertical-align:top;
}
th{
  background:#f5f5f5;
  text-align:center;
}
.nominal{
  text-align:right;
  font-weight:bold;
}
.rincian{
  line-height:1.6;
}
.tanggal{
  font-size:13px;
  color:#444;
}
</style>
</head>

<body>

<div class="card">
<h2>Pengeluaran Dana Donasi</h2>

<!-- INPUT -->
<label>Tanggal</label>
<input type="date" id="tanggal">

<label>Uraian Pengeluaran</label>
<textarea id="uraian" rows="3"
  placeholder="Contoh: Pembelian alat kebersihan sekolah"></textarea>

<label>Jumlah Pengeluaran (Rp)</label>
<input type="number" id="jumlah" placeholder="Contoh: 250000">

<button id="simpan">Simpan Pengeluaran</button>

<!-- RINGKASAN -->
<div class="ringkasan" id="ringkasan">
Jumlah Pemasukan Rp 0<br>
Jumlah Pengeluaran Rp 0<br>
Saldo Rp 0
</div>

<!-- TABEL -->
<h3 style="margin-top:25px">Rincian Pengeluaran</h3>

<table>
<thead>
<tr>
  <th width="20">No</th>
  <th>Rincian</th>
  <th width="90">Jumlah Rp</th>
</tr>
</thead>
<tbody id="list">
<tr>
  <td colspan="3" style="text-align:center;color:#777">
    Memuat data...
  </td>
</tr>
</tbody>
</table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= CONFIG ================= */
const app = initializeApp({
  apiKey:"AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain:"datasiswa-c10f4.firebaseapp.com",
  projectId:"datasiswa-c10f4"
});
const db = getFirestore(app);

/* ================= ELEMENT ================= */
const tanggalEl = document.getElementById("tanggal");
const uraianEl = document.getElementById("uraian");
const jumlahEl = document.getElementById("jumlah");
const simpanBtn = document.getElementById("simpan");
const ringkasanEl = document.getElementById("ringkasan");
const listEl = document.getElementById("list");

/* ================= DEFAULT TANGGAL HARI INI ================= */
const today = new Date().toISOString().split("T")[0];
tanggalEl.value = today;

/* ================= HELPER ================= */
function rupiah(n){
  return "Rp " + n.toLocaleString("id-ID");
}

function formatTanggalDMY(tgl){
  // tgl format: yyyy-mm-dd
  if(!tgl) return "-";
  const [y,m,d] = tgl.split("-");
  return `${d}-${m}-${y.slice(2)}`;
}


/* ================= SIMPAN PENGELUARAN ================= */
simpanBtn.onclick = async ()=>{
  const tanggal = tanggalEl.value;
  const uraian = uraianEl.value.trim();
  const jumlah = Number(jumlahEl.value);

  if(!tanggal || !uraian || !jumlah){
    alert("Lengkapi data pengeluaran");
    return;
  }

  await addDoc(collection(db,"pengeluaran"),{
    tanggal,
    uraian,
    jumlah,
    dibuat: serverTimestamp()
  });

  uraianEl.value="";
  jumlahEl.value="";
};

/* ================= RINGKASAN PEMASUKAN ================= */
let totalPemasukan = 0;
let totalPengeluaran = 0;

onSnapshot(
  query(
    collection(db,"donasi"),
    where("statusValidasi","==","valid")
  ),
  snap=>{
    totalPemasukan = 0;
    snap.forEach(d=> totalPemasukan += d.data().nominal || 0);
    updateRingkasan();
  }
);

/* ================= RINGKASAN & LIST PENGELUARAN ================= */
onSnapshot(
  query(
    collection(db,"pengeluaran"),
    orderBy("dibuat","desc")
  ),
  snap=>{
    if(snap.empty){
      listEl.innerHTML = `
        <tr>
          <td colspan="3" style="text-align:center;color:#777">
            Belum ada pengeluaran
          </td>
        </tr>`;
      totalPengeluaran = 0;
      updateRingkasan();
      return;
    }

    let no = 1;
    let html = "";
    totalPengeluaran = 0;

    snap.forEach(doc=>{
      const d = doc.data();
      totalPengeluaran += d.jumlah;

      html += `
      <tr>
        <td style="text-align:center">${no}</td>
        <td>
          <div class="rincian">
          <div class="tanggal">${formatTanggalDMY(d.tanggal)}</div>

            <div>${d.uraian}</div>
          </div>
        </td>
        <td class="nominal">${rupiah(d.jumlah)}</td>
      </tr>`;
      no++;
    });

    listEl.innerHTML = html;
    updateRingkasan();
  }
);

/* ================= UPDATE RINGKASAN ================= */
function updateRingkasan(){
  const saldo = totalPemasukan - totalPengeluaran;
  ringkasanEl.innerHTML = `
    Jumlah Pemasukan ${rupiah(totalPemasukan)}<br>
    Jumlah Pengeluaran ${rupiah(totalPengeluaran)}<br>
    Saldo ${rupiah(saldo)}
  `;
}


</script>

</body>
</html>
