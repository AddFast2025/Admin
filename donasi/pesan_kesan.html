<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesan & Kesan Alumni</title>

<style>
body{
  margin:0;
  font-family:system-ui, Arial, sans-serif;
  background:linear-gradient(160deg,#ffe0b2,#ffb74d,#ff9800);
  min-height:100vh;
  padding:20px;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:420px;
}

/* JUDUL */
h1{
  font-size:22px;
  margin:0;
  text-align:center;
  font-weight:800;
}
h2{
  font-size:16px;
  margin:4px 0 18px;
  text-align:center;
  font-weight:700;
}

/* BUTTON */
.btn{
  width:100%;
  height:52px;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:800;
  background:#0284c7;
  color:#fff;
  cursor:pointer;
  box-shadow:0 6px 16px rgba(2,132,199,.35);
}
.btn:active{transform:scale(.97)}

/* FORM */
.form{
  display:none;
  background:#fff;
  margin-top:14px;
  padding:16px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.2);
}

label{
  display:block;
  margin-top:10px;
  font-weight:700;
  font-size:14px;
}
input, textarea{
  width:100%;
  margin-top:6px;
  padding:10px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
}
textarea{min-height:100px}

/* LIST */
.list{margin-top:20px}
.item{
  background:#fff;
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  box-shadow:0 4px 14px rgba(0,0,0,.15);
}
.tanggal{
  font-size:12px;
  font-weight:none;
  color:#0f172a;
}
</style>
</head>

<body>

<div class="container">
  <h1>Pesan & Kesan Alumni</h1>
  <h2>SDN Sidobandung II</h2>

  <button class="btn" onclick="tampilkanForm()">Pesan Kesan</button>

  <!-- FORM -->
  <div class="form" id="formPesan">
    <label>Nama</label>
    <input id="nama">

    <label>Lulusan (Opsional)</label>
    <input id="lulusan">

    <label>Alamat</label>
    <input id="alamat">

    <label>No WA (Opsional)</label>
    <input id="wa">

    <label>Isi Pesan</label>
    <textarea id="pesan"></textarea>

    <button class="btn" style="margin-top:14px" onclick="simpanPesan()">Simpan</button>
  </div>

  <!-- DAFTAR PESAN -->
  <div class="list" id="listPesan"></div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* CONFIG */
const app = initializeApp({
  apiKey:"AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain:"datasiswa-c10f4.firebaseapp.com",
  projectId:"datasiswa-c10f4"
});
const db = getFirestore(app);

/* FORMAT TANGGAL */
function formatTanggal(ts){
  if(!ts) return "-";
  const d = ts.toDate();
  return d.toLocaleString("id-ID",{
    day:"2-digit",
    month:"2-digit",
    year:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

window.tampilkanForm = function(){
  document.getElementById("formPesan").style.display = "block";
}

/* SIMPAN */
window.simpanPesan = async function(){
  if(!nama.value || !pesan.value){
    alert("Nama dan Pesan wajib diisi");
    return;
  }

  await addDoc(collection(db,"pesan_kesan"),{
    nama: nama.value,
    lulusan: lulusan.value,
    alamat: alamat.value,
    wa: wa.value,
    pesan: pesan.value,
    tampil:true,
    createdAt: serverTimestamp()
  });

  nama.value=lulusan.value=alamat.value=wa.value=pesan.value="";
  document.getElementById("formPesan").style.display="none";
}

/* LOAD PESAN */
const q = query(
  collection(db,"pesan_kesan"),
  where("tampil","==",true),
  orderBy("createdAt","desc")
);

onSnapshot(q,(snap)=>{
  listPesan.innerHTML="";
  snap.forEach(doc=>{
    const d = doc.data();

    listPesan.innerHTML += `
      <div class="item">
        <div class="tanggal">
          ${formatTanggal(d.createdAt)}
        </div>

        <div style="font-weight:800;font-size:15px">
          ${d.nama}
          <span style="font-weight:500;font-size:13px;color:#475569">
            _ Lulus ${d.lulusan || "-"}
            ${d.wa ? ` _ WA: ${d.wa}` : ""}
          </span>
        </div>

        <div style="margin-top:4px;font-size:13px;color:#334155">
          Alamat : ${d.alamat || "-"}
        </div>

        <div style="margin-top:8px;font-size:16px;line-height:1.6">
          ${d.pesan}
        </div>
      </div>
    `;
  });
});

/* SHORTCUT */
const nama = document.getElementById("nama");
const lulusan = document.getElementById("lulusan");
const alamat = document.getElementById("alamat");
const wa = document.getElementById("wa");
const pesan = document.getElementById("pesan");
const listPesan = document.getElementById("listPesan");
</script>

</body>
</html>
