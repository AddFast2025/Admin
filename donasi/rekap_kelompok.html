<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekapitulasi Donasi Berdasarkan Kelompok Donatur</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}
.card{
  max-width:800px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
h2{
  text-align:center;
  margin-bottom:10px;
}
.subjudul{
  font-size:14px;
  margin-bottom:10px;
}
.total{
  font-weight:bold;
  margin-bottom:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border:1px solid #000;
  padding:10px;
}
th{
  background:#f5f5f5;
  text-align:center;
}
td:nth-child(1){
  text-align:center;
  width:20px;
}
td:nth-child(3){
  text-align:right;
  font-weight:bold;
width:90px;
}
</style>
</head>

<body>

<div class="card">
<h2>Rekapitulasi Donasi Berdasarkan Kelompok Donatur</h2>

<div class="subjudul">
Jumlah donasi sampai saat ini adalah
<b id="totalDonasi">Rp 0</b>
</div>

<table>
<thead>
<tr>
  <th>No</th>
  <th>Status Donatur</th>
  <th>Jumlah Rp</th>
</tr>
</thead>
<tbody id="list">
<tr>
  <td colspan="3" style="text-align:center;color:#777">
    Memuat data...
  </td>
</tr>
</tbody>
</table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= CONFIG ================= */
const app = initializeApp({
  apiKey:"AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain:"datasiswa-c10f4.firebaseapp.com",
  projectId:"datasiswa-c10f4"
});
const db = getFirestore(app);

/* ================= HELPER ================= */
function rupiah(n){
  return "Rp " + n.toLocaleString("id-ID");
}

/* ================= LOAD DATA ================= */
const listEl = document.getElementById("list");
const totalEl = document.getElementById("totalDonasi");

const q = query(
  collection(db,"donasi"),
  where("statusValidasi","==","valid")
);

onSnapshot(q,(snap)=>{
  if(snap.empty){
    listEl.innerHTML = `
      <tr>
        <td colspan="3" style="text-align:center;color:#777">
          Belum ada donasi tervalidasi
        </td>
      </tr>`;
    totalEl.innerHTML = "Rp 0";
    return;
  }

  const rekap = {};
  let total = 0;

  snap.forEach(doc=>{
    const d = doc.data();
    const status = d.statusDonatur || "Tidak Diketahui";
    const nominal = d.nominal || 0;

    if(!rekap[status]) rekap[status] = 0;
    rekap[status] += nominal;
    total += nominal;
  });

  let no = 1;
  let html = "";

  for(const status in rekap){
    html += `
    <tr>
      <td>${no}</td>
      <td>${status}</td>
      <td>${rupiah(rekap[status])}</td>
    </tr>
    `;
    no++;
  }

  listEl.innerHTML = html;
  totalEl.innerHTML = rupiah(total);
});
</script>

</body>
</html>
