<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekapitulasi Donasi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}
.card{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
h2{
  text-align:center;
  margin-bottom:10px;
}
.subjudul{
  margin-bottom:15px;
  font-size:14px;
}
.total{
  font-weight:bold;
  margin-bottom:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border:1px solid #000;
  padding:10px;
  vertical-align:top;
}
th{
  background:#f5f5f5;
  text-align:center;
}

.rincian{
  line-height:1.6;
}

.tanggal{
  font-size:13px;
  color:#444;
}

.status{
  font-weight:bold;
  margin-top:4px;
}

.nama{
  margin-top:4px;
}

.nominal{
  font-weight:bold;
  text-align:right;
  white-space:nowrap;
}
</style>
</head>

<body>

<div class="card">
<h2>Rekapitulasi Pemasukan Donasi<br>SDN Sidobandung II</h2>

<div class="subjudul">
Menampilkan donasi yang <b>sudah tervalidasi</b>
</div>

<div class="total" id="totalDonasi">
Jumlah donasi sampai saat ini adalah Rp 0
</div>

<table>
<thead>
<tr>
  <th width="20">No</th>
  <th>Rincian</th>
  <th width="90">Jumlah Rp</th>
</tr>
</thead>
<tbody id="list">
<tr>
  <td colspan="3" style="text-align:center;color:#777">
    Memuat data...
  </td>
</tr>
</tbody>
</table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= CONFIG ================= */
const app = initializeApp({
  apiKey:"AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain:"datasiswa-c10f4.firebaseapp.com",
  projectId:"datasiswa-c10f4"
});
const db = getFirestore(app);

/* ================= HELPER ================= */
function formatTanggalJam(ts){
  if(!ts) return "-";
  const d = ts.toDate();
  const tgl = d.toLocaleDateString("id-ID",{
    day:"2-digit",month:"short",year:"numeric"
  });
  const jam = d.toLocaleTimeString("id-ID",{
    hour:"2-digit",minute:"2-digit"
  });
  return `${tgl} ${jam}`;
}

function rupiah(n){
  return "Rp " + n.toLocaleString("id-ID");
}

/* ================= LOAD DATA ================= */
const listEl = document.getElementById("list");
const totalEl = document.getElementById("totalDonasi");

const q = query(
  collection(db,"donasi"),
  where("statusValidasi","==","valid"),
  orderBy("createdAt","desc")
);

onSnapshot(q,(snap)=>{
  if(snap.empty){
    listEl.innerHTML = `
      <tr>
        <td colspan="3" style="text-align:center;color:#777">
          Belum ada donasi tervalidasi
        </td>
      </tr>`;
    totalEl.innerHTML = "Jumlah donasi sampai saat ini adalah Rp 0";
    return;
  }

  let no = 1;
  let html = "";
  let total = 0;

  snap.forEach(dok=>{
    const d = dok.data();
    total += d.nominal;

    html += `
    <tr>
      <td style="text-align:center">${no}</td>

      <td>
        <div class="rincian">
          <div class="tanggal">
            ${formatTanggalJam(d.createdAt)}
          </div>
          <div class="status">
            ${d.statusDonatur}
          </div>
          <div class="nama">
            ${d.nama}
          </div>
        </div>
      </td>

      <td class="nominal">
        ${rupiah(d.nominal)}
      </td>
    </tr>
    `;
    no++;
  });

  listEl.innerHTML = html;
  totalEl.innerHTML =
    `Jumlah donasi sampai saat ini adalah <b>${rupiah(total)}</b>`;
});
</script>

</body>
</html>
