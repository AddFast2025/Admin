<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekapitulasi Donasi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}
.card{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
h2{
  text-align:center;
  margin-bottom:10px;
}
.subjudul{
  margin-bottom:10px;
  font-size:14px;
}
.filter{
  margin-bottom:15px;
  font-size:14px;
}
.filter select{
  padding:6px 10px;
  border-radius:6px;
  border:1px solid #ccc;
  margin-right:10px;
}
.total{
  font-weight:bold;
  margin-bottom:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border:1px solid #000;
  padding:10px;
  vertical-align:top;
}
th{
  background:#f5f5f5;
  text-align:center;
}

.rincian{ line-height:1.6; }
.tanggal{ font-size:13px; color:#444; }
.status{ font-weight:bold; margin-top:4px; }
.nama{ margin-top:4px; }
.nominal{
  font-weight:bold;
  text-align:right;
  white-space:nowrap;
}
</style>
</head>

<body>

<div class="card">
<h2>Rekapitulasi Pemasukan Donasi<br>SDN Sidobandung II</h2>

<div class="subjudul">
Menampilkan donasi yang <b>sudah tervalidasi</b>
</div>

<div class="filter">
  Mode Tampilan :
  <select id="modeTampil">
    <option value="detail">Detail Donasi</option>
    <option value="rekap">Rekap Perkelompok Donatur</option>
  </select>

  <span id="statusWrapper">
    Status Donatur :
    <select id="filterStatus">
      <option value="all">Semua Status</option>
    </select>
  </span>
</div>

<div class="total" id="totalDonasi">
Jumlah donasi sampai saat ini adalah Rp 0
</div>

<table>
<thead>
<tr>
  <th width="30">No</th>
  <th>Rincian</th>
  <th width="120">Jumlah Rp</th>
</tr>
</thead>
<tbody id="list">
<tr>
  <td colspan="3" style="text-align:center;color:#777">
    Memuat data...
  </td>
</tr>
</tbody>
</table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= CONFIG ================= */
const app = initializeApp({
  apiKey:"AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain:"datasiswa-c10f4.firebaseapp.com",
  projectId:"datasiswa-c10f4"
});
const db = getFirestore(app);

/* ================= HELPER ================= */
function formatTanggalJam(ts){
  if(!ts) return "-";
  const d = ts.toDate();
  return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})
    + " " +
    d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
}
function rupiah(n){
  return "Rp " + n.toLocaleString("id-ID");
}

/* ================= ELEMENT ================= */
const listEl = document.getElementById("list");
const totalEl = document.getElementById("totalDonasi");
const filterEl = document.getElementById("filterStatus");
const modeEl = document.getElementById("modeTampil");
const statusWrapper = document.getElementById("statusWrapper");

let dataDonasi = [];

/* ================= LOAD DATA ================= */
const q = query(
  collection(db,"donasi"),
  where("statusValidasi","==","valid")
);

onSnapshot(q,(snap)=>{
  dataDonasi = [];
  const statusSet = new Set();

  snap.forEach(doc=>{
    const d = doc.data();
    dataDonasi.push(d);
    if(d.statusDonatur) statusSet.add(d.statusDonatur);
  });

  filterEl.innerHTML =
    `<option value="all">Semua Status</option>`;
  statusSet.forEach(s=>{
    filterEl.innerHTML += `<option value="${s}">${s}</option>`;
  });

  toggleStatusFilter();
  render();
});

/* ================= TOGGLE FILTER ================= */
function toggleStatusFilter(){
  if(modeEl.value === "rekap"){
    statusWrapper.style.display = "none";
  }else{
    statusWrapper.style.display = "inline";
  }
}

/* ================= RENDER ================= */
function render(){
  const mode = modeEl.value;
  const status = filterEl.value;

  /* ===== MODE REKAP ===== */
  if(mode === "rekap"){
    const kelompok = {};
    let grandTotal = 0;

    dataDonasi.forEach(d=>{
      if(!kelompok[d.statusDonatur]){
        kelompok[d.statusDonatur] = 0;
      }
      kelompok[d.statusDonatur] += d.nominal;
      grandTotal += d.nominal;
    });

    const hasil = Object.entries(kelompok)
      .map(([status,total])=>({status,total}))
      .sort((a,b)=> b.total - a.total);

    let html = "";
    let no = 1;

    hasil.forEach(h=>{
      html += `
      <tr>
        <td style="text-align:center">${no++}</td>
        <td><b>${h.status}</b></td>
        <td class="nominal">${rupiah(h.total)}</td>
      </tr>`;
    });

    listEl.innerHTML = html;
    totalEl.innerHTML =
      `Total seluruh donasi adalah <b>${rupiah(grandTotal)}</b>`;
    return;
  }

  /* ===== MODE DETAIL ===== */
  let filtered = dataDonasi.filter(d=>{
    return status === "all" || d.statusDonatur === status;
  });

  if(status === "all"){
    filtered.sort((a,b)=>{
      if(!a.createdAt || !b.createdAt) return 0;
      return b.createdAt.toDate() - a.createdAt.toDate();
    });
  }else{
    filtered.sort((a,b)=> b.nominal - a.nominal);
  }

  if(filtered.length === 0){
    listEl.innerHTML = `
      <tr>
        <td colspan="3" style="text-align:center;color:#777">
          Data tidak ditemukan
        </td>
      </tr>`;
    totalEl.innerHTML =
      "Jumlah donasi sampai saat ini adalah Rp 0";
    return;
  }

  let html = "";
  let total = 0;
  let no = 1;

  filtered.forEach(d=>{
    total += d.nominal;
    html += `
    <tr>
      <td style="text-align:center">${no++}</td>
      <td>
        <div class="rincian">
          <div class="tanggal">${formatTanggalJam(d.createdAt)}</div>
          <div class="status">${d.statusDonatur}</div>
          <div class="nama">${d.nama}</div>
        </div>
      </td>
      <td class="nominal">${rupiah(d.nominal)}</td>
    </tr>`;
  });

  listEl.innerHTML = html;
  totalEl.innerHTML =
    `Jumlah donasi sampai saat ini adalah <b>${rupiah(total)}</b>`;
}

modeEl.addEventListener("change", ()=>{
  toggleStatusFilter();
  render();
});
filterEl.addEventListener("change", render);
</script>

</body>
</html>
