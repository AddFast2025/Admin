<!DOCTYPE html>

.wrapper{

}

.card{

    color:#0d47a1;

}

h2{
    margin:10px 0 20px 0;
    color:#333;
    font-size:17px;
}

.qr{
    margin:20px 0;
}

/* Thumbnail responsive */
.qr img{
    width:100%;
    max-width:220px;
    height:auto;
    border:5px solid #1976d2;
    border-radius:15px;
}

/* WhatsApp icon */
.wa-icon{
    width:30px;
    margin-top:10px;
}

.footer{
    margin-top:20px;
    font-size:14px;
    color:#555;
}
</style>
</head>
