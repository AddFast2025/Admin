<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nilai Hafalan Siswa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; background:#f4f6f8; padding:20px; }
.card { max-width:1000px; margin:auto; background:#fff; padding:20px; border-radius:8px; }

label { font-weight:bold; display:block; margin-top:10px; }
select, button { width:100%; padding:8px; margin-top:5px; }
button { background:#1565c0; color:white; border:none; cursor:pointer; }

table { width:100%; border-collapse:collapse; margin-top:20px; }
th,td { border:1px solid #ddd; padding:6px; text-align:center; }
th { background:#e3f2fd; }

.subjudul {
  text-align:center;
  font-weight:bold;
  color:#1565c0;
  margin-bottom:15px;
}

tfoot td {
  font-weight:bold;
  background:#f1f8e9;
}

/* ==== Tombol Aksi ==== */
.aksi-btn{
  background:none;
  border:none;
  padding:0 6px;
  font-size:16px;
  cursor:pointer;
}

/* efek hover */
.aksi-btn:hover{
  transform:scale(1.2);
}

/* khusus tombol delete jadi merah */
.btn-delete{
  color:#e53935;
}

/* ==== Modal ==== */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.modal-box{
  background:white;
  padding:25px;
  border-radius:8px;
  width:300px;
  text-align:center;
}


/* kecilkan lebar kolom tertentu */
th:nth-child(1),
td:nth-child(1){
  width:30px;   /* kolom No */
}

th:nth-child(4),
td:nth-child(4){
  width:40px;   /* kolom Nilai */
}

th:nth-child(5),
td:nth-child(5){
  width:30px;   /* kolom Aksi */
}

/* kecilkan padding agar lebih ramping */
th, td{
  padding:4px 6px;
}

/* kecilkan ukuran ikon aksi */
.aksi-btn{
  font-size:14px;
}

</style>
</head>

<body>

<!-- ================= POPUP KODE ================= -->
<div id="popupKode" style="
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:flex;align-items:center;justify-content:center;z-index:999;">

  <div style="background:white;padding:30px;width:320px;border-radius:8px;text-align:center;">
    <h3>Masukkan Kode Lembaga</h3>
    <input type="text" id="kodeSekolah"
      style="width:100%;padding:8px;margin-top:10px;">
    <button onclick="cekKode()">Masuk</button>
    <div id="infoKode" style="color:red;margin-top:10px;"></div>
  </div>
</div>

<!-- ================= HALAMAN ================= -->
<div id="halaman" style="display:none;">
<div class="card">

<h2 align="center">Nilai Hafalan Siswa</h2>
<div id="namaLembaga" class="subjudul"></div>

<label>Pilih Kelas</label>
<select id="kelas">
<option value="">-- Pilih Kelas --</option>
</select>

<label>Pilih Rombel</label>
<select id="rombel">
<option value="">-- Pilih Rombel --</option>
</select>

<label>Pilih Siswa</label>
<select id="siswa">
<option value="">-- Pilih Siswa --</option>
</select>

<button onclick="tampilkan()">Tampilkan</button>
<button onclick="bukaDeleteSemua()" 
  style="background:#e53935;margin-top:8px;">
  Hapus Seluruh Nilai Siswa
</button>

<div id="tabel"></div>

</div>
</div>

<!-- ================= MODAL EDIT ================= -->
<div id="modalEdit" class="modal">
  <div class="modal-box">
    <h3>Edit Nilai</h3>
    <input type="number" id="editNilaiInput"
      style="width:100%;padding:8px;margin:10px 0;">
    <button onclick="simpanEdit()">Simpan</button>
    <button onclick="tutupModal()"
      style="background:#ccc;color:black;margin-top:8px;">
      Batal
    </button>
  </div>
</div>

<!-- ================= MODAL DELETE ================= -->
<div id="modalDelete" class="modal">
  <div class="modal-box">
    <h3>Hapus Nilai?</h3>
    <p>Data yang dihapus tidak bisa dikembalikan.</p>
    <button onclick="konfirmasiHapus()"
      style="background:#e53935;">Ya, Hapus</button>
    <button onclick="tutupModal()"
      style="background:#ccc;color:black;margin-top:8px;">
      Batal
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  query, where, doc,
  updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "APIKEY",
  authDomain: "datasiswa-c10f4.firebaseapp.com",
  projectId: "datasiswa-c10f4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let lembagaId = "";
let lembagaNama = "";
let editId = null;
let deleteId = null;

const kelasEl = document.getElementById("kelas");
const rombelEl = document.getElementById("rombel");
const siswaEl = document.getElementById("siswa");
const tabelEl = document.getElementById("tabel");

const savedKode = localStorage.getItem("kodeSekolah");
if (savedKode) {
  document.getElementById("kodeSekolah").value = savedKode;
}

window.cekKode = async () => {
  const kode = document.getElementById("kodeSekolah").value.trim();

  const snap = await getDocs(
    query(collection(db,"lembaga"),
    where("kode","==",kode),
    where("aktif","==",true))
  );

  if (snap.empty) {
    document.getElementById("infoKode").innerText = "Kode tidak ditemukan";
    return;
  }

  lembagaId = snap.docs[0].id;
  lembagaNama = snap.docs[0].data().nama;

  localStorage.setItem("kodeSekolah", kode);

  document.getElementById("namaLembaga").innerText = lembagaNama;
  document.getElementById("popupKode").style.display="none";
  document.getElementById("halaman").style.display="block";

  loadKelas();
};

async function loadKelas(){
  const snap = await getDocs(
    query(collection(db,"kelas"),
    where("lembagaId","==",lembagaId))
  );

  snap.forEach(d=>{
    kelasEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`;
  });
}

kelasEl.onchange = async () => {
  tabelEl.innerHTML="";
  siswaEl.innerHTML="<option value=''>-- Pilih Siswa --</option>";
  rombelEl.innerHTML="<option value=''>-- Pilih Rombel --</option>";

  if (!kelasEl.value) return;

  const snap = await getDocs(
    query(collection(db,"rombel"),
    where("kelasId","==",kelasEl.value))
  );

  snap.forEach(d=>{
    rombelEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`;
  });
};

rombelEl.onchange = async () => {
  tabelEl.innerHTML="";
  siswaEl.innerHTML="<option value=''>-- Pilih Siswa --</option>";

  if (!rombelEl.value) return;

  const snap = await getDocs(
    query(collection(db,"hafalan_daftar"),
    where("rombelId","==",rombelEl.value),
    where("lembagaId","==",lembagaId))
  );

  let siswaUnik={};
  snap.forEach(d=>{
    siswaUnik[d.data().namaSiswa]=true;
  });

  Object.keys(siswaUnik).forEach(nama=>{
    siswaEl.innerHTML += `<option value="${nama}">${nama}</option>`;
  });
};

window.tampilkan = async () => {
  if (!siswaEl.value) return;
  tabelEl.innerHTML="";

  const snap = await getDocs(
    query(collection(db,"hafalan_daftar"),
    where("lembagaId","==",lembagaId))
  );

  let dataSiswa=[];
  let totalSiswa=0;

  snap.forEach(d=>{
    const r=d.data();
    if(r.namaSiswa===siswaEl.value && r.nilaiPeroleh){
      dataSiswa.push({
        id:d.id,
        mapel:r.mapelNama,
        materi:r.namaMateri,
        nilai:Number(r.nilaiPeroleh)
      });
      totalSiswa+=Number(r.nilaiPeroleh);
    }
  });

  dataSiswa.sort((a,b)=>a.mapel.localeCompare(b.mapel));

  let html=`
  <table>
  <thead>
  <tr>
    <th>No</th>
    <th>Mapel</th>
    <th>Materi</th>
    <th>Nilai</th>
    <th>Aksi</th>
  </tr>
  </thead>
  <tbody>`;

  let no=1;

  dataSiswa.forEach(item=>{
    html+=`
    <tr>
      <td>${no++}</td>
      <td>${item.mapel}</td>
      <td>${item.materi}</td>
      <td>${item.nilai}</td>
      <td>
  <button class="aksi-btn"
    onclick="bukaEdit('${item.id}',${item.nilai})">✏️</button>

  <button class="aksi-btn btn-delete"
    onclick="bukaDelete('${item.id}')">🗑</button>
</td>
    </tr>`;
  });

  html+=`
  </tbody>
  <tfoot>
    <tr>
      <td colspan="3">Total Nilai</td>
      <td>${totalSiswa}</td>
      <td></td>
    </tr>
  </tfoot>
  </table>`;

  tabelEl.innerHTML=html;
};

window.bukaEdit=(id,nilai)=>{
  editId=id;
  document.getElementById("editNilaiInput").value=nilai;
  document.getElementById("modalEdit").style.display="flex";
};

window.simpanEdit=async()=>{
  const nilaiBaru=document.getElementById("editNilaiInput").value;
  await updateDoc(doc(db,"hafalan_daftar",editId),{
    nilaiPeroleh:Number(nilaiBaru)
  });
  tutupModal();
  tampilkan();
};

window.bukaDelete=(id)=>{
  deleteId=id;
  document.getElementById("modalDelete").style.display="flex";
};

window.konfirmasiHapus=async()=>{
  await deleteDoc(doc(db,"hafalan_daftar",deleteId));
  tutupModal();
  tampilkan();
};

window.tutupModal=()=>{
  document.getElementById("modalEdit").style.display="none";
  document.getElementById("modalDelete").style.display="none";
};

// ================= BUKA DELETE SEMUA =================
window.bukaDeleteSemua = () => {

  if (!siswaEl.value) {
    alert("Pilih siswa terlebih dahulu");
    return;
  }

  const nama = siswaEl.value;

  document.getElementById("teksHapusSemua").innerHTML =
    `Semua nilai <b>${nama}</b> akan dihapus permanen.`;

  document.getElementById("modalDeleteSemua").style.display="flex";
};

// ================= KONFIRMASI DELETE SEMUA =================
window.konfirmasiHapusSemua = async () => {

  const snap = await getDocs(
    query(collection(db,"hafalan_daftar"),
      where("lembagaId","==",lembagaId),
      where("namaSiswa","==",siswaEl.value)
    )
  );

  const promises = [];

  snap.forEach(d=>{
    promises.push(deleteDoc(doc(db,"hafalan_daftar",d.id)));
  });

  await Promise.all(promises);

  tutupModal();
  tampilkan();
};

window.tutupModal = () => {
  document.getElementById("modalEdit").style.display="none";
  document.getElementById("modalDelete").style.display="none";
  document.getElementById("modalDeleteSemua").style.display="none";
};
</script>
<!-- ================= MODAL DELETE SEMUA ================= -->
<div id="modalDeleteSemua" class="modal">
  <div class="modal-box">
    <h3>Hapus Semua Nilai?</h3>
  <p id="teksHapusSemua"></p>
    <button onclick="konfirmasiHapusSemua()"
      style="background:#e53935;">
      Ya, Hapus Semua
    </button>
    <button onclick="tutupModal()"
      style="background:#ccc;color:black;margin-top:8px;">
      Batal
    </button>
  </div>
</div>

</body>
</html>
