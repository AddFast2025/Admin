<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Guru - Penilaian Hafalan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; background:#f4f6f8; padding:20px; }
.card { max-width:1000px; margin:auto; background:#fff; padding:20px; border-radius:8px; }

label { font-weight:bold; display:block; margin-top:10px; }
select, input, button { width:100%; padding:8px; margin-top:5px; }

button { background:#1565c0; color:white; border:none; cursor:pointer; }
button.kecil { padding:4px 8px; font-size:12px; }
button.simpan { background:#2e7d32; }

button:disabled { background:#9e9e9e; }

table { width:100%; border-collapse:collapse; margin-top:15px; }
th,td { border:1px solid #ddd; padding:6px; text-align:center; }
th { background:#e8f5e9; }

.panel {
  border:1px solid #c8e6c9;
  background:#f1f8e9;
  padding:15px;
  margin-top:20px;
  border-radius:6px;
  display:none;
}

.notice { color:#c62828; font-weight:bold; margin-top:10px; }
</style>
</head>


<body>
<div id="popupKode" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
z-index:999;
">

  <div style="
  background:white;
  padding:30px;
  width:320px;
  border-radius:8px;
  text-align:center;
  ">

    <h3>Masukkan Kode Sekolah</h3>

    <input type="text" id="kodeSekolah"
      placeholder="Contoh: sb"
      style="width:100%; padding:8px; margin-top:10px;">

    <button onclick="cekKodeSekolah()"
      style="width:100%; margin-top:10px;">Masuk</button>

    <div id="kodeInfo"
      style="color:red; margin-top:10px;"></div>

  </div>
</div>


<div id="halamanUtama" style="display:none;">
  <div class="card">

<h2 align="center">Penilaian Hafalan Siswa</h2>

<!-- FILTER -->
<label>Lembaga</label>
<select id="lembaga"></select>

<label>Kelas</label>
<select id="kelas">
  <option value="">Semua Kelas</option>
</select>

<label>Rombel</label>
<select id="rombel">
  <option value="">Semua Rombel</option>
</select>

<label>Mapel</label>
<select id="mapel">
  <option value="">Semua Mapel</option>
</select>

  
  <!-- PANEL NILAI -->
<div id="panelNilai" class="panel">
  <h3>Input Nilai Hafalan</h3>

  <label>Kelas</label>
  <input id="p_kelas" disabled>

  <label>Rombel</label>
  <input id="p_rombel" disabled>

  <label>Nama Siswa</label>
  <input id="p_nama" disabled>

  <label>Mapel</label>
  <input id="p_mapel" disabled>

  <label>Materi</label>
  <input id="p_materi" disabled>

  <label>Nilai Maksimal</label>
  <input id="p_maks" disabled>

  <label>Nilai</label>
  <input id="p_nilai" type="number">

 <button id="btnSimpan" class="simpan" onclick="simpanNilai()" disabled>
  Simpan Nilai
</button>

</div>
  
<button onclick="loadAntrian()">Tampilkan Antrian</button>

<div id="list"></div>



</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  query, where, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain: "datasiswa-c10f4.firebaseapp.com",
  projectId: "datasiswa-c10f4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ELEMENT */
const lembagaEl = document.getElementById("lembaga");
const kelasEl = document.getElementById("kelas");
const rombelEl = document.getElementById("rombel");
const mapelEl = document.getElementById("mapel");
const listEl = document.getElementById("list");
const panel = document.getElementById("panelNilai");
const kodeEl = document.getElementById("kodeSekolah");
const kodeInfo = document.getElementById("kodeInfo");


window.cekKodeSekolah = async () => {

  const kode = kodeEl.value.trim();

  if (!kode) {
    kodeInfo.innerText = "Masukkan kode sekolah";
    return;
  }

  const snap = await getDocs(
   query(
      collection(db,"lembaga"),
      where("kode","==",kode),
      where("aktif","==",true)
    )
  );

  if (snap.empty) {
    kodeInfo.innerText = "Kode tidak ditemukan";
    return;
  }


  const docData = snap.docs[0];

  lembagaEl.innerHTML =
    `<option value="${docData.id}">
      ${docData.data().nama}
    </option>`;

  lembagaEl.disabled = true;

  localStorage.setItem("kodeSekolah", kode);

  lembagaEl.dispatchEvent(new Event("change"));

  document.getElementById("popupKode").style.display = "none";
  document.getElementById("halamanUtama").style.display = "block";
};

// ⬇ PINDAHKAN KE SINI
const savedKode = localStorage.getItem("kodeSekolah");

if (savedKode) {
  kodeEl.value = savedKode;
  
}


let aktifDocId = null;
let aktifNilaiMaks = 0;
let dataGlobal = {};


/* LOAD MASTER */
async function loadLembaga() {
  const snap = await getDocs(collection(db,"lembaga"));
  lembagaEl.innerHTML = "<option value=''>-- Pilih Lembaga --</option>";
  snap.forEach(d => lembagaEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`);
}


lembagaEl.onchange = async () => {
  kelasEl.innerHTML = "<option value=''>Semua Kelas</option>";
  rombelEl.innerHTML = "<option value=''>Semua Rombel</option>";

  const snap = await getDocs(
    query(collection(db,"kelas"), where("lembagaId","==",lembagaEl.value))
  );
  snap.forEach(d => kelasEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`);
};

kelasEl.onchange = async () => {
  rombelEl.innerHTML = "<option value=''>Semua Rombel</option>";
  if (!kelasEl.value) return;

  const snap = await getDocs(
    query(collection(db,"rombel"), where("kelasId","==",kelasEl.value))
  );
  snap.forEach(d => rombelEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`);
};

async function loadMapel() {
  const snap = await getDocs(collection(db,"mapel"));
  mapelEl.innerHTML = "<option value=''>Semua Mapel</option>";
  snap.forEach(d => mapelEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`);
}
loadMapel();

window.cekKodeSekolah = async () => {

  const kode = kodeEl.value.trim();

  if (!kode) {
    kodeInfo.innerText = "Masukkan kode sekolah";
    return;
  }

  const snap = await getDocs(
    query(
      collection(db,"lembaga"),
      where("kode","==",kode),
      where("aktif","==",true)
    )
  );

  if (snap.empty) {
    kodeInfo.innerText = "Kode tidak ditemukan";
    return;
  }

  const docData = snap.docs[0];

  // isi dropdown lembaga otomatis
  lembagaEl.innerHTML =
    `<option value="${docData.id}">
      ${docData.data().nama}
    </option>`;

  lembagaEl.disabled = true;

  // simpan ke localStorage
  localStorage.setItem("kodeSekolah", kode);

  // trigger load kelas
  lembagaEl.dispatchEvent(new Event("change"));

  // tampilkan halaman utama
  document.getElementById("popupKode").style.display = "none";
  document.getElementById("halamanUtama").style.display = "block";
};



/* LOAD ANTRIAN */
window.loadAntrian = async () => {
  panel.style.display = "none";
  listEl.style.display = "block";
  listEl.innerHTML = "Memuat...";

  if (!lembagaEl.value) {
    listEl.innerHTML = "Pilih lembaga terlebih dahulu";
    return;
  }

  const snap = await getDocs(
    query(
      collection(db,"hafalan_daftar"),
      where("lembagaId","==",lembagaEl.value),
      where("status","==","daftar")
    )
  );

  if (snap.empty) {
    listEl.innerHTML = "Tidak ada antrian";
    return;
  }

const data = [];

snap.forEach(d => {
  data.push({
    id: d.id,
    ...d.data()
  });
});

const siswaSudahDinilai = await getSiswaSudahDinilaiHariIni();


// urutkan berdasarkan tanggal daftar
data.sort((a, b) => {
  const tglA = a.tanggalDaftar?.toDate ? a.tanggalDaftar.toDate() : new Date(a.tanggalDaftar);
  const tglB = b.tanggalDaftar?.toDate ? b.tanggalDaftar.toDate() : new Date(b.tanggalDaftar);

  return tglA - tglB;
});
  let html = `
  <table>
    <tr>
      <th>No</th>
      <th>Kls</th>
      <th>Nama</th>
      <th>Mapel / Materi</th>
      <th>Aksi</th>
    </tr>`;
  let no = 1;

data.forEach(r => {
    dataGlobal[r.id] = r; // ✅ TAMBAHAN INI

    if (kelasEl.value && r.kelasId !== kelasEl.value) return;
    if (rombelEl.value && r.rombelId !== rombelEl.value) return;
    if (mapelEl.value && r.mapelId !== mapelEl.value) return;

    html += `
    <tr>
      <td>${no++}</td>
      <td>${r.kelasNama}/${r.rombelNama}</td>



<td>
  ${r.namaSiswa}
  <br>
  <small style="color:gray;">
    ${formatTanggal(r.tanggalDaftar)}
  </small>

  ${
    siswaSudahDinilai[r.siswaId]

      ? `<br><small style="color:#c62828; font-weight:bold;">
           🔴 Sudah mendapatkan nilai hari ini
         </small>`
      : ""
  }
</td>





      <td>${r.mapelNama}<br><small>${r.namaMateri}</small></td>
      <td>

<button class="kecil"
  style="${siswaSudahDinilai[r.siswaId] ? 'background:#9e9e9e' : ''}"
  ${siswaSudahDinilai[r.siswaId] ? "disabled" : ""}
  onclick='bukaNilai("${r.id}")'>
  ${siswaSudahDinilai[r.siswaId] ? "✔ Sudah" : "Nilai"}
</button>


  <br><br>

  <button class="kecil btn-hapus"
  style="background:#c62828; color:white;"
  data-id="${r.id}">
  🗑 Hapus
</button>

</td>
    </tr>`;
  });

  html += "</table>";
  listEl.innerHTML = html;
};

/* BUKA PANEL NILAI */
window.bukaNilai = (id) => {

  const r = dataGlobal[id]; // ✅ ambil dari dataGlobal

  aktifDocId = id;
  aktifNilaiMaks = r.nilaiMaks;

  document.getElementById("p_kelas").value = r.kelasNama;
  document.getElementById("p_rombel").value = r.rombelNama;
  document.getElementById("p_nama").value = r.namaSiswa;
  document.getElementById("p_mapel").value = r.mapelNama;
  document.getElementById("p_materi").value = r.namaMateri;
  document.getElementById("p_maks").value = r.nilaiMaks;
  document.getElementById("p_nilai").value = "";
  

  panel.style.display = "block";
   listEl.style.display = "none"; // ✅ TAMBAHAN

  btnSimpan.disabled = true;
};

const inputNilai = document.getElementById("p_nilai");
const btnSimpan = document.getElementById("btnSimpan");

inputNilai.addEventListener("input", () => {
  const val = inputNilai.value;

  if (val === "") {
    btnSimpan.disabled = true;
    return;
  }

  const angka = Number(val);

  if (!isNaN(angka) && angka >= 0 && angka <= aktifNilaiMaks) {
    btnSimpan.disabled = false;
  } else {
    btnSimpan.disabled = true;
  }
});

/* SIMPAN NILAI */
window.simpanNilai = async () => {
  const nilai = Number(document.getElementById("p_nilai").value);
  if (isNaN(nilai) || nilai < 0 || nilai > aktifNilaiMaks) {
    alert("Nilai tidak valid");
    return;
  }

  await updateDoc(doc(db,"hafalan_daftar",aktifDocId), {
    nilaiPeroleh: nilai,
    status: nilai === aktifNilaiMaks ? "lulus" : "dinilai",
    tanggalNilai: new Date()
  });

  panel.style.display = "none";
  listEl.style.display = "block";
  loadAntrian();
};

window.hapusAntrian = async (id, nama, mapel, materi) => {

  const konfirmasi = confirm(
    `Anda ingin menghapus antrian ${mapel} - ${materi} milik ${nama} ?`
  );

  if (!konfirmasi) return;

  await updateDoc(doc(db, "hafalan_daftar", id), {
    status: "selesai",
    tanggalSelesai: new Date()
  });

  alert("Antrian dihapus (nilai tetap aman)");

  loadAntrian();
};

function formatTanggal(tgl) {
  if (!tgl) return "-";

  const d = tgl.toDate ? tgl.toDate() : new Date(tgl);

  return d.toLocaleString("id-ID", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

async function getSiswaSudahDinilaiHariIni() {

  const snap = await getDocs(
    query(
      collection(db,"hafalan_daftar"),
      where("tanggalNilai","!=", null)
    )
  );

  const hariIni = new Date().toDateString();
  const map = {}; // siswaId -> true

  snap.forEach(d => {
    const r = d.data();
    if (!r.tanggalNilai) return;

    const tgl = r.tanggalNilai.toDate
      ? r.tanggalNilai.toDate()
      : new Date(r.tanggalNilai);

    if (tgl.toDateString() === hariIni) {
      map[r.siswaId] = true;
    }
  });

  return map;
}

document.addEventListener("click", (e) => {

  if (e.target.classList.contains("btn-hapus")) {

    const id = e.target.dataset.id;

    const r = dataGlobal[id]; // ambil data lengkap

    hapusAntrian(
      id,
      r.namaSiswa,
      r.mapelNama,
      r.namaMateri
    );
  }

});


</script>

</body>
</html>
