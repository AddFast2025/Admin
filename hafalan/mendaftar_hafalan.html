<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pendaftaran Hafalan Siswa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; background:#f4f6f8; padding:20px; }
.card { max-width:1000px; margin:auto; background:#fff; padding:20px; border-radius:8px; }

label { font-weight:bold; display:block; margin-top:10px; }
select, button { width:100%; padding:8px; margin-top:5px; }

button { background:#2e7d32; color:white; border:none; cursor:pointer; margin-top:10px; }
button.hapus { background:#c62828; padding:4px 8px; font-size:12px; }
button:disabled { background:#9e9e9e; }

table { width:100%; border-collapse:collapse; margin-top:10px; }
th,td { border:1px solid #ddd; padding:6px; text-align:center; }
th { background:#e8f5e9; }

.notice { color:#c62828; font-weight:bold; margin-top:10px; }
.info { color:#1565c0; font-weight:bold; margin-top:10px; }
</style>
</head>
  </div>
</div>
<body>

    <div id="popupKode" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
">

  <div style="
  background:white;
  padding:30px;
  width:300px;
  border-radius:8px;
  text-align:center;
  ">

    <h3>Masukkan Kode Sekolah</h3>

    <input type="text" id="kodeSekolah" placeholder=""
      style="width:100%; padding:8px; margin-top:10px;">

    <button onclick="cekKodeSekolah()"
      style="width:100%; margin-top:10px;">Masuk</button>

    <div id="kodeInfo" style="color:red; margin-top:10px;"></div>

  </div>
</div>

<div id="halamanUtama" style="display:none;">
  <div class="card">
<h2 align="center">Pendaftaran Hafalan Siswa</h2>

<div id="kodeInfo" class="notice"></div>


<!-- IDENTITAS -->
<label>Lembaga</label>
<select id="lembaga"></select>

<label>Kelas</label>
<select id="kelas"></select>

<label>Rombel</label>
<select id="rombel"></select>

<label>Nama Siswa</label>
<select id="siswa"></select>

<hr>

<!-- HAFALAN -->
<label>Mapel</label>
<select id="mapel"></select>

<label>Materi Hafalan</label>
<select id="materi"></select>

<button id="btnTambah" onclick="tambahKeranjang()">Tambah ke Keranjang</button>

<div id="info" class="info"></div>

<hr>
<h3>Keranjang Pendaftaran</h3>
<div id="keranjang">Belum ada</div>

<button onclick="daftarkanTerpilih()">Daftarkan</button>

<hr>
<h3>Antrian Hafalan</h3>
<div id="antrian">Pilih siswa</div>

</div>

<script type="module">

   import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  where,
  addDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain: "datasiswa-c10f4.firebaseapp.com",
  projectId: "datasiswa-c10f4"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ELEMENT */
const lembagaEl = document.getElementById("lembaga");
const kelasEl = document.getElementById("kelas");
const rombelEl = document.getElementById("rombel");
const siswaEl = document.getElementById("siswa");
const mapelEl = document.getElementById("mapel");
const materiEl = document.getElementById("materi");
const keranjangEl = document.getElementById("keranjang");
const antrianEl = document.getElementById("antrian");
const infoEl = document.getElementById("info");
const kodeEl = document.getElementById("kodeSekolah");
const kodeInfo = document.getElementById("kodeInfo");
const savedKode = localStorage.getItem("kodeSekolah");

if (savedKode) {
  kodeEl.value = savedKode; // isi otomatis ke input
}

let keranjang = [];
// Load keranjang dari localStorage saat awal



let antrianMateri = {}; // materiId -> true
let jumlahAntrian = 0;
let identitasTerkunci = false;
const MAX_KERANJANG = 5;
const MAX_ANTRIAN_MAPEL = 20;

/* ================= UTIL ================= */
function lockIdentitas() {
  identitasTerkunci = true;
  lembagaEl.disabled = kelasEl.disabled = rombelEl.disabled = siswaEl.disabled = true;
}

/* ================= LOAD MASTER ================= */
async function loadLembaga() {
  const snap = await getDocs(collection(db,"lembaga"));
  lembagaEl.innerHTML = "<option value=''>-- Pilih --</option>";
  snap.forEach(d => lembagaEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`);
}


lembagaEl.onchange = async () => {
  if (identitasTerkunci) return;
  kelasEl.innerHTML = rombelEl.innerHTML = siswaEl.innerHTML = "";
  const snap = await getDocs(query(collection(db,"kelas"), where("lembagaId","==",lembagaEl.value)));
  kelasEl.innerHTML = "<option value=''>-- Pilih --</option>";
  snap.forEach(d => kelasEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`);
};

kelasEl.onchange = async () => {
  if (identitasTerkunci) return;
  rombelEl.innerHTML = siswaEl.innerHTML = "";
  const snap = await getDocs(query(collection(db,"rombel"), where("kelasId","==",kelasEl.value)));
  rombelEl.innerHTML = "<option value=''>-- Pilih --</option>";
  snap.forEach(d => rombelEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`);
};

rombelEl.onchange = async () => {
  if (identitasTerkunci) return;
  siswaEl.innerHTML = "";
  const snap = await getDocs(query(collection(db,"siswa"), where("rombelId","==",rombelEl.value)));
  siswaEl.innerHTML = "<option value=''>-- Pilih --</option>";
  snap.forEach(d => siswaEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`);
};

siswaEl.onchange = async () => {
  await cekAntrian();
  await loadKeranjangFirestore();
};

/* MAPEL */
async function loadMapel() {

  mapelEl.innerHTML = "<option value=''>-- Pilih --</option>";

  const snapMapel = await getDocs(collection(db,"mapel"));

  for (const docSnap of snapMapel.docs) {

    const d = docSnap.data();

    const snapAntrian = await getDocs(
      query(
        collection(db,"hafalan_daftar"),
        where("mapelId","==",docSnap.id),
        where("lembagaId","==",lembagaEl.value),
        where("status","==","daftar")
      )
    );

    const jumlah = snapAntrian.size;

    let label = `${d.nama} (${jumlah})`;

    if (jumlah >= MAX_ANTRIAN_MAPEL) {
      label = `${d.nama} (${jumlah} - Penuh)`;
    }

    mapelEl.innerHTML += `
      <option value="${docSnap.id}" data-nama="${d.nama}">
        ${label}
      </option>
    `;
  }
}


renderKeranjang();


window.cekKodeSekolah = async () => {

  const kode = kodeEl.value.trim().toLowerCase();

  if (!kode) {
    kodeInfo.innerText = "Masukkan kode sekolah";
    return;
  }

  const snap = await getDocs(
    query(
      collection(db,"lembaga"),
      where("kode","==",kode),
      where("aktif","==",true)
    )
  );

  if (snap.empty) {
    kodeInfo.innerText = "Kode tidak ditemukan atau tidak aktif";
    return;
  }

  const doc = snap.docs[0];


  // Set dropdown lembaga otomatis
  lembagaEl.innerHTML = `
    <option value="${doc.id}">
      ${doc.data().nama}
    </option>`;

  lembagaEl.disabled = true; // kunci lembaga
  await loadMapel();
  kodeEl.disabled = true; // kunci kode
  kodeInfo.innerText = "Lembaga ditemukan ✔";
  lembagaEl.dispatchEvent(new Event("change"));

  localStorage.setItem("kodeSekolah", kode);

document.getElementById("popupKode").style.display = "none";
document.getElementById("halamanUtama").style.display = "block";
};

/* ================= CEK ANTRIAN ================= */
async function cekAntrian() {
  antrianEl.innerHTML = "Memuat...";
  antrianMateri = {};
  jumlahAntrian = 0;

  const snap = await getDocs(
    query(
      collection(db,"hafalan_daftar"),
      where("siswaId","==",siswaEl.value),
      where("status","==","daftar")
    )
  );

  jumlahAntrian = snap.size;

  let html = "<ul>";
  snap.forEach(d => {
    const r = d.data();
    antrianMateri[r.materiId] = true;
    html += `<li>${r.mapelNama} - ${r.namaMateri}</li>`;
  });
  html += "</ul>";

  antrianEl.innerHTML = snap.empty ? "Tidak ada antrian" : html;
}

/* ================= STATUS MATERI ================= */
async function statusMateriSiswa() {
  const snap = await getDocs(
    query(collection(db,"hafalan_daftar"), where("siswaId","==",siswaEl.value))
  );
  const map = {};
  snap.forEach(d => map[d.data().materiId] = d.data().status);
  return map;
}

/* MAPEL CHANGE */
mapelEl.onchange = async () => {
  if (!mapelEl.value) return;
  lockIdentitas();

  materiEl.innerHTML = "<option value=''>-- Pilih Materi --</option>";
  const statusMap = await statusMateriSiswa();

  const snap = await getDocs(
    query(collection(db,"materi_hafalan"), where("mapelId","==",mapelEl.value))
  );

  snap.forEach(d => {
    const r = d.data();
    const status = statusMap[d.id] || "belum";

    let icon = "🔴 ";
    let disabled = "";

    if (status === "lulus") {
      icon = "🔵 ";
      disabled = "disabled";
    } else if (status === "dinilai") {
      icon = "🟡 ";
    }

    materiEl.innerHTML += `
      <option value="${d.id}" ${disabled}
        data-status="${status}"
        data-nama="${r.namaMateri}"
        data-nilai="${r.nilaiMaks}">
        ${icon}${r.namaMateri}
      </option>`;
  });
};

/* ================= KERANJANG ================= */
window.tambahKeranjang = async () => {
  infoEl.innerText = "";
  const opt = materiEl.selectedOptions[0];
  if (!opt) return;

  const materiId = materiEl.value;

  if (opt.dataset.status === "lulus") {
    infoEl.innerText = "Materi sudah lulus";
    return;
  }

  if (antrianMateri[materiId]) {
    infoEl.innerText = "Materi ini masih dalam antrian";
    return;
  }

  if (keranjang.some(k => k.materiId === materiId)) {
    infoEl.innerText = "Materi sudah ada di keranjang";
    return;
  }

  if (keranjang.length >= MAX_KERANJANG) {
  infoEl.innerText = "Keranjang maksimal 5 materi";
  return;
}
const docRef = await addDoc(collection(db,"keranjang_hafalan"), {
  siswaId: siswaEl.value,
  mapelId: mapelEl.value,
  mapelNama: mapelEl.options[mapelEl.selectedIndex].dataset.nama,
  materiId: materiId,
  namaMateri: opt.dataset.nama,
  nilaiMaks: Number(opt.dataset.nilai),
  tanggalTambah: new Date()
});

keranjang.push({
  docId: docRef.id, // sekarang sudah ada nilainya
  mapelId: mapelEl.value,
  mapelNama: mapelEl.options[mapelEl.selectedIndex].dataset.nama,
  materiId: materiId,
  namaMateri: opt.dataset.nama,
  nilaiMaks: Number(opt.dataset.nilai)
});

  renderKeranjang();
  simpanKeranjangLocal();
};



function renderKeranjang() {
  if (!keranjang.length) {
    keranjangEl.innerHTML = "Belum ada";
    return;
  }

  let html = `
  <table>
    <tr>
      <th>Pilih</th>
      <th>No</th>
      <th>Mapel</th>
      <th>Materi</th>
      <th>Aksi</th>
    </tr>`;

  keranjang.forEach((k,i) => {
    html += `
    <tr>
      <td>
        <input type="radio" name="pilihMateri" value="${i}">
      </td>
      <td>${i+1}</td>
      <td>${k.mapelNama}</td>
      <td>${k.namaMateri}</td>
      <td>
        <button class="hapus" onclick="hapusKeranjang(${i})">❌</button>
      </td>
    </tr>`;
  });

  html += "</table>";
  keranjangEl.innerHTML = html;
}



window.hapusKeranjang = async (i) => {

  const item = keranjang[i];

  await deleteDoc(doc(db,"keranjang_hafalan", item.docId));

  keranjang.splice(i,1);
  renderKeranjang();
};


window.daftarkanTerpilih = async () => {

  if (jumlahAntrian > 0) {
    alert("Masih ada antrian hafalan yang belum selesai");
    return;
  }

  const radio = document.querySelector("input[name='pilihMateri']:checked");

  if (!radio) {
    alert("Pilih satu materi terlebih dahulu");
    return;
  }

  const index = Number(radio.value);
  const k = keranjang[index];

  // 🔎 CEK JUMLAH ANTRIAN MAPEL TERSEBUT
  const snapMapel = await getDocs(
    query(
      collection(db,"hafalan_daftar"),
      where("mapelId","==",k.mapelId),
      where("lembagaId","==",lembagaEl.value),
      where("status","==","daftar")
    )
  );

  const jumlahMapel = snapMapel.size;

  if (jumlahMapel >= MAX_ANTRIAN_MAPEL) {
  alert(
    `Antrian mapel ${k.mapelNama} sudah penuh (${jumlahMapel}).\n\nSilakan pilih mapel lain.`
  );
  return;
}

 const lanjut = confirm(
  `Saat ini ada ${jumlahMapel} / ${MAX_ANTRIAN_MAPEL} antrian untuk mapel ${k.mapelNama}.\n\nLanjutkan pendaftaran?`
);
  if (!lanjut) return;

  await addDoc(collection(db,"hafalan_daftar"), {
    siswaId: siswaEl.value,
    namaSiswa: siswaEl.options[siswaEl.selectedIndex].text,
    lembagaId: lembagaEl.value,
    lembagaNama: lembagaEl.options[lembagaEl.selectedIndex].text,
    kelasId: kelasEl.value,
    kelasNama: kelasEl.options[kelasEl.selectedIndex].text,
    rombelId: rombelEl.value,
    rombelNama: rombelEl.options[rombelEl.selectedIndex].text,

    mapelId: k.mapelId,
    mapelNama: k.mapelNama,
    materiId: k.materiId,
    namaMateri: k.namaMateri,
    nilaiMaks: k.nilaiMaks,

    nilaiPeroleh: null,
    status: "daftar",
    tanggalDaftar: new Date()
  });

  await deleteDoc(doc(db,"keranjang_hafalan", k.docId));

  keranjang.splice(index, 1);

  simpanKeranjangLocal();
  renderKeranjang();
  cekAntrian();

  alert("Berhasil didaftarkan");
};

/* ================= SIMPAN ================= */
window.simpanPendaftaran = async () => {
  if (!keranjang.length) return;

  for (const k of keranjang) {
    await addDoc(collection(db,"hafalan_daftar"), {
      siswaId: siswaEl.value,
      namaSiswa: siswaEl.options[siswaEl.selectedIndex].text,
      lembagaId: lembagaEl.value,
      lembagaNama: lembagaEl.options[lembagaEl.selectedIndex].text,
      kelasId: kelasEl.value,
      kelasNama: kelasEl.options[kelasEl.selectedIndex].text,
      rombelId: rombelEl.value,
      rombelNama: rombelEl.options[rombelEl.selectedIndex].text,

      mapelId: k.mapelId,
      mapelNama: k.mapelNama,
      materiId: k.materiId,
      namaMateri: k.namaMateri,
      nilaiMaks: k.nilaiMaks,

      nilaiPeroleh: null,
      status: "daftar",
      tanggalDaftar: new Date()
    });
  }

  keranjang = [];
  renderKeranjang();
  cekAntrian();
  alert("Pendaftaran berhasil");
};

function simpanKeranjangLocal() {
  localStorage.setItem("keranjangHafalan", JSON.stringify(keranjang));
}

async function loadKeranjangFirestore() {

  keranjang = [];

  const snap = await getDocs(
    query(
      collection(db,"keranjang_hafalan"),
      where("siswaId","==",siswaEl.value)
    )
  );

  snap.forEach(docSnap => {
    const d = docSnap.data();

    keranjang.push({
      docId: docSnap.id,
      mapelId: d.mapelId,
      mapelNama: d.mapelNama,
      materiId: d.materiId,
      namaMateri: d.namaMateri,
      nilaiMaks: d.nilaiMaks
    });
  });

  renderKeranjang();
}

</script>

</body>
</html>
