<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nilai Hafalan Siswa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; background:#f4f6f8; padding:20px; }
.card { max-width:1000px; margin:auto; background:#fff; padding:20px; border-radius:8px; }

label { font-weight:bold; display:block; margin-top:10px; }
select, button { width:100%; padding:8px; margin-top:5px; }

button { background:#1565c0; color:white; border:none; cursor:pointer; }

table { width:100%; border-collapse:collapse; margin-top:20px; }
th,td { border:1px solid #ddd; padding:6px; text-align:center; }
th { background:#e3f2fd; }

.subjudul {
  text-align:center;
  font-weight:bold;
  color:#1565c0;
  margin-bottom:15px;
}
tfoot td {
  font-weight:bold;
  background:#f1f8e9;
}
</style>
</head>

<body>

<!-- ================= POPUP ================= -->
<div id="popupKode" style="
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:flex;align-items:center;justify-content:center;z-index:999;">

  <div style="background:white;padding:30px;width:320px;border-radius:8px;text-align:center;">
    <h3>Masukkan Kode Lembaga</h3>
    <input type="text" id="kodeSekolah"
  style="width:100%;padding:8px;margin-top:10px;">
    <button onclick="cekKode()">Masuk</button>
    <div id="infoKode" style="color:red;margin-top:10px;"></div>
  </div>
</div>

<!-- ================= HALAMAN ================= -->
<div id="halaman" style="display:none;">
<div class="card">

<h2 align="center">Nilai Hafalan Siswa</h2>
<div id="namaLembaga" class="subjudul"></div>

<label>Pilih Kelas</label>
<select id="kelas">
<option value="">-- Pilih Kelas --</option>
</select>

<label>Pilih Rombel</label>
<select id="rombel">
<option value="">-- Pilih Rombel --</option>
</select>

<label>Pilih Siswa</label>
<select id="siswa">
<option value="">-- Pilih Siswa --</option>
</select>

<button onclick="tampilkan()">Tampilkan</button>

<div id="tabel"></div>

</div>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  query, where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "APIKEY",
  authDomain: "datasiswa-c10f4.firebaseapp.com",
  projectId: "datasiswa-c10f4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let lembagaId = "";
let lembagaNama = "";

const kelasEl = document.getElementById("kelas");
const rombelEl = document.getElementById("rombel");
const siswaEl = document.getElementById("siswa");
const tabelEl = document.getElementById("tabel");

const kodeInput = document.getElementById("kodeSekolah");

// Ambil kode tersimpan
const savedKode = localStorage.getItem("kodeSekolah");

if (savedKode) {
  kodeInput.value = savedKode;
}


/* ================= CEK KODE ================= */
window.cekKode = async () => {

  const kode = document.getElementById("kodeSekolah").value.trim();

  const snap = await getDocs(
    query(collection(db,"lembaga"),
    where("kode","==",kode),
    where("aktif","==",true))
  );

  if (snap.empty) {
    document.getElementById("infoKode").innerText = "Kode tidak ditemukan";
    return;
  }

 lembagaId = snap.docs[0].id;
lembagaNama = snap.docs[0].data().nama;

localStorage.setItem("kodeSekolah", kode);

  document.getElementById("namaLembaga").innerText = lembagaNama;

  document.getElementById("popupKode").style.display="none";
  document.getElementById("halaman").style.display="block";

  loadKelas();
};

/* ================= LOAD KELAS ================= */
async function loadKelas(){

  const snap = await getDocs(
    query(collection(db,"kelas"),
    where("lembagaId","==",lembagaId))
  );

  snap.forEach(d=>{
    kelasEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`;
  });
}

/* ================= LOAD ROMBEL ================= */
kelasEl.onchange = async () => {

  tabelEl.innerHTML = "";
  siswaEl.innerHTML = "<option value=''>-- Pilih Siswa --</option>";
  rombelEl.innerHTML = "<option value=''>-- Pilih Rombel --</option>";

  if (!kelasEl.value) return;

  const snap = await getDocs(
    query(collection(db,"rombel"),
    where("kelasId","==",kelasEl.value))
  );

  snap.forEach(d=>{
    rombelEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`;
  });
};

/* ================= LOAD SISWA ================= */
rombelEl.onchange = async () => {

  tabelEl.innerHTML = "";
  siswaEl.innerHTML = "<option value=''>-- Pilih Siswa --</option>";

  if (!rombelEl.value) return;

  const snap = await getDocs(
    query(collection(db,"hafalan_daftar"),
    where("rombelId","==",rombelEl.value),
    where("lembagaId","==",lembagaId))
  );

  let siswaUnik = {};

  snap.forEach(d=>{
    const r = d.data();
    siswaUnik[r.namaSiswa] = true;
  });

  Object.keys(siswaUnik).forEach(nama=>{
    siswaEl.innerHTML += `<option value="${nama}">${nama}</option>`;
  });
};

/* ================= TAMPILKAN ================= */
window.tampilkan = async () => {

  if (!siswaEl.value) return;

  tabelEl.innerHTML = "";   // 🔥 bersihkan dulu

  const snap = await getDocs(
    query(collection(db,"hafalan_daftar"),
    where("lembagaId","==",lembagaId))
  );

  let dataSiswa = [];
  let totalSiswa = 0;

  let totalPerSiswaKelas = {};
  let totalPerSiswaSekolah = {};

  snap.forEach(d=>{
    const r = d.data();
    if (!r.nilaiPeroleh) return;

    const nilai = Number(r.nilaiPeroleh);

    // ===== SEKOLAH =====
    if (!totalPerSiswaSekolah[r.namaSiswa]) {
      totalPerSiswaSekolah[r.namaSiswa] = 0;
    }
    totalPerSiswaSekolah[r.namaSiswa] += nilai;

    // ===== KELAS =====
    if (r.kelasId === kelasEl.value) {
      if (!totalPerSiswaKelas[r.namaSiswa]) {
        totalPerSiswaKelas[r.namaSiswa] = 0;
      }
      totalPerSiswaKelas[r.namaSiswa] += nilai;
    }

    // ===== SISWA YANG DIPILIH =====
    if (r.namaSiswa === siswaEl.value) {
      totalSiswa += nilai;

      dataSiswa.push({
        mapel: r.mapelNama,
        materi: r.namaMateri,
        nilai: nilai
      });
    }
  });

  // ================= SORT MAPEL =================
  dataSiswa.sort((a,b)=>{
    if (a.mapel !== b.mapel) {
      return a.mapel.localeCompare(b.mapel);
    }
    return a.materi.localeCompare(b.materi); // sekalian urut materi
  });

  // ================= HITUNG RATA =================
  const jumlahSiswaKelas = Object.keys(totalPerSiswaKelas).length;
  const totalKelas = Object.values(totalPerSiswaKelas)
                      .reduce((a,b)=>a+b,0);

  const rataKelas = jumlahSiswaKelas ?
        (totalKelas / jumlahSiswaKelas).toFixed(2) : 0;

  const jumlahSiswaSekolah = Object.keys(totalPerSiswaSekolah).length;
  const totalSekolah = Object.values(totalPerSiswaSekolah)
                        .reduce((a,b)=>a+b,0);

  const rataSekolah = jumlahSiswaSekolah ?
        (totalSekolah / jumlahSiswaSekolah).toFixed(2) : 0;

  // ================= RENDER TABEL =================
  let html = `
  <table>
  <thead>
  <tr>
    <th>No</th>
    <th>Mapel</th>
    <th>Materi</th>
    <th>Nilai</th>
  </tr>
  </thead>
  <tbody>
  `;

  let no = 1;

  dataSiswa.forEach(item=>{
    html += `
    <tr>
      <td>${no++}</td>
      <td>${item.mapel}</td>
      <td>${item.materi}</td>
      <td>${item.nilai}</td>
    </tr>`;
  });

  html += `
  </tbody>
  <tfoot>
    <tr>
      <td colspan="3">Jumlah Total Nilai</td>
      <td>${totalSiswa}</td>
    </tr>
    <tr>
      <td colspan="3">Rata-rata Kelas</td>
      <td>${rataKelas}</td>
    </tr>
    <tr>
      <td colspan="3">Rata-rata Sekolah</td>
      <td>${rataSekolah}</td>
    </tr>
  </tfoot>
  </table>`;

  tabelEl.innerHTML = html;
};
</script>

</body>
</html>
