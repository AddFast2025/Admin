<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekap Nilai Akumulasi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; background:#f4f6f8; padding:20px; }
.card { max-width:1000px; margin:auto; background:#fff; padding:20px; border-radius:8px; }

label { font-weight:bold; display:block; margin-top:10px; }
select, button { width:100%; padding:8px; margin-top:5px; }

button { background:#1565c0; color:white; border:none; cursor:pointer; }

table { width:100%; border-collapse:collapse; margin-top:20px; }
th,td { border:1px solid #ddd; padding:6px; text-align:center; }
th { background:#e3f2fd; }

.subjudul {
  text-align:center;
  margin-top:-10px;
  margin-bottom:15px;
  font-weight:bold;
  color:#1565c0;
}
</style>
</head>

<body>

<!-- ================= POPUP KODE ================= -->
<div id="popupKode" style="
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.6);
display:flex;align-items:center;justify-content:center;z-index:999;">

  <div style="background:white;padding:30px;width:320px;border-radius:8px;text-align:center;">
    <h3>Masukkan Kode Lembaga</h3>
    <input type="text" id="kodeSekolah" placeholder="Contoh: sb"
      style="width:100%;padding:8px;margin-top:10px;">
    <button onclick="cekKode()">Masuk</button>
    <div id="infoKode" style="color:red;margin-top:10px;"></div>
  </div>
</div>

<!-- ================= HALAMAN ================= -->
<div id="halaman" style="display:none;">
<div class="card">

<h2 align="center">Rekap Nilai Akumulasi Siswa</h2>
<div id="namaLembaga" class="subjudul"></div>

<label>Bulan</label>
<select id="bulan">
<option value="">Semua Bulan</option>
<option value="0">Januari</option>
<option value="1">Februari</option>
<option value="2">Maret</option>
<option value="3">April</option>
<option value="4">Mei</option>
<option value="5">Juni</option>
<option value="6">Juli</option>
<option value="7">Agustus</option>
<option value="8">September</option>
<option value="9">Oktober</option>
<option value="10">November</option>
<option value="11">Desember</option>
</select>

<label>Kelas</label>
<select id="kelas">
<option value="">Semua Kelas</option>
</select>

<label>Rombel</label>
<select id="rombel">
<option value="">Semua Rombel</option>
</select>

<button onclick="tampilkan()">Tampilkan</button>

<div id="tabel"></div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, getDocs,
  query, where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "APIKEY",
  authDomain: "datasiswa-c10f4.firebaseapp.com",
  projectId: "datasiswa-c10f4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let lembagaId = "";
let lembagaNama = "";

const kelasEl = document.getElementById("kelas");
const rombelEl = document.getElementById("rombel");

/* ================= CEK KODE ================= */
window.cekKode = async () => {

  const kode = document.getElementById("kodeSekolah").value.trim();

  const snap = await getDocs(
    query(collection(db,"lembaga"),
    where("kode","==",kode),
    where("aktif","==",true))
  );

  if (snap.empty) {
    document.getElementById("infoKode").innerText = "Kode tidak ditemukan";
    return;
  }

  lembagaId = snap.docs[0].id;
  lembagaNama = snap.docs[0].data().nama;

  document.getElementById("namaLembaga").innerText = lembagaNama;

  document.getElementById("popupKode").style.display="none";
  document.getElementById("halaman").style.display="block";

  loadKelas();
};

/* ================= LOAD KELAS ================= */
async function loadKelas(){

  kelasEl.innerHTML = "<option value=''>Semua Kelas</option>";

  const snap = await getDocs(
    query(collection(db,"kelas"),
    where("lembagaId","==",lembagaId))
  );

  snap.forEach(d=>{
    kelasEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`;
  });
}

/* ================= LOAD ROMBEL ================= */
kelasEl.onchange = async () => {

  rombelEl.innerHTML = "<option value=''>Semua Rombel</option>";

  if (!kelasEl.value) return;

  const snap = await getDocs(
    query(collection(db,"rombel"),
    where("kelasId","==",kelasEl.value))
  );

  snap.forEach(d=>{
    rombelEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`;
  });
};

/* ================= TAMPILKAN ================= */
window.tampilkan = async () => {

  const bulan = document.getElementById("bulan").value;
  const kelas = kelasEl.value;
  const rombel = rombelEl.value;

  const snap = await getDocs(
    query(collection(db,"hafalan_daftar"),
    where("lembagaId","==",lembagaId))
  );

  let rekap = {};

  snap.forEach(d=>{
    const r = d.data();
    if (!r.nilaiPeroleh) return;

    if (kelas && r.kelasId !== kelas) return;
    if (rombel && r.rombelId !== rombel) return;

    if (bulan && r.tanggalNilai){
      const tgl = r.tanggalNilai.toDate();
      if (tgl.getMonth() != bulan) return;
    }

const kelasGabung = r.kelasNama + r.rombelNama;

const key = r.namaSiswa + "_" + kelasGabung;

if (!rekap[key]) {
  rekap[key] = {
    kelas: kelasGabung,   // 🔥 sekarang 1A, 2B, dst
    nama: r.namaSiswa,
    total: 0
  };
}



    rekap[key].total += Number(r.nilaiPeroleh);
  });

  let data = Object.values(rekap);

  data.sort((a,b)=>{
    if (a.kelas !== b.kelas) {
      return a.kelas.localeCompare(b.kelas);
    }
    return b.total - a.total;
  });

  renderTabel(data);
};

/* ================= RENDER ================= */
function renderTabel(data){

  if (data.length === 0) {
    document.getElementById("tabel").innerHTML = "<p>Tidak ada data.</p>";
    return;
  }

  let html = `
  <table>
  <tr>
    <th>No</th>
    <th>Kelas</th>
    <th>Nama</th>
    <th>Total Nilai</th>
  </tr>`;

  let no=1;

  data.forEach(r=>{
    html += `
    <tr>
      <td>${no++}</td>
      <td>${r.kelas}</td>
      <td>${r.nama}</td>
      <td><b>${r.total}</b></td>
    </tr>`;
  });

  html += "</table>";

  document.getElementById("tabel").innerHTML = html;
}
</script>

</body>
</html>
