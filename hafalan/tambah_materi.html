<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Master Materi Hafalan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; background:#f4f6f8; padding:20px; }
.card { max-width:900px; margin:auto; background:#fff; padding:20px; border-radius:8px; }

label { font-weight:bold; display:block; margin-top:10px; }
select, textarea, input, button { width:100%; padding:8px; margin-top:5px; }

textarea {
  min-height:120px;
  font-family: monospace;
}

button {
  background:#2e7d32;
  color:white;
  border:none;
  margin-top:10px;
  cursor:pointer;
}

.error { color:red; margin-top:10px; }

table { width:100%; border-collapse:collapse; margin-top:15px; }
th,td { border:1px solid #ddd; padding:6px; text-align:center; }
th { background:#e8f5e9; }

.aksi button {
  padding:4px 8px;
  margin:2px;
  border-radius:4px;
  border:none;
  cursor:pointer;
  color:white;
}
.edit { background:#1565c0; }
.hapus { background:#c62828; }
.batal { background:#757575; }
</style>
</head>
<body>

<div class="card">
<h2 align="center">Master Materi Hafalan</h2>

<label>Mapel</label>
<select id="mapel"></select>

<!-- MODE EDIT -->
<div id="editBox" style="display:none">
  <label>Edit Materi</label>
  <input id="editNama">
  <label>Nilai Maksimal</label>
  <input id="editNilai" type="number">
  <button onclick="updateMateri()">Simpan Perubahan</button>
  <button class="batal" onclick="batalEdit()">Batal</button>
</div>

<!-- MODE TAMBAH MASSAL -->
<div id="tambahBox">
  <label>Paste Materi (1 baris = Nama | Nilai)</label>
  <textarea id="materi" placeholder="Contoh:
Al-Baqarah 1–5|100
Al-Baqarah 6–10|100"></textarea>
  <button onclick="simpanMassal()">Simpan Materi</button>
</div>

<div id="error" class="error"></div>

<hr>
<h3>Daftar Materi</h3>
<div id="list">Memuat...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  query, where, deleteDoc, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain: "datasiswa-c10f4.firebaseapp.com",
  projectId: "datasiswa-c10f4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const mapelEl = document.getElementById("mapel");
const listEl = document.getElementById("list");
const editBox = document.getElementById("editBox");
const tambahBox = document.getElementById("tambahBox");

let editId = null;

/* LOAD MAPEL */
async function loadMapel() {
  const snap = await getDocs(collection(db,"mapel"));
  mapelEl.innerHTML = "";
  snap.forEach(d => {
    mapelEl.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`;
  });
  if (mapelEl.value) loadMateri();
}

/* LOAD MATERI */
async function loadMateri() {
  listEl.innerHTML = "Memuat...";
  const snap = await getDocs(
    query(collection(db,"materi_hafalan"), where("mapelId","==",mapelEl.value))
  );

  if (snap.empty) {
    listEl.innerHTML = "Belum ada materi";
    return;
  }

  let html = `
  <table>
    <tr>
      <th>No</th>
      <th>Materi</th>
      <th>Nilai Maks</th>
      <th>Aksi</th>
    </tr>
  `;
  let no = 1;
  snap.forEach(d => {
    const r = d.data();
    html += `
      <tr>
        <td>${no++}</td>
        <td>${r.namaMateri}</td>
        <td>${r.nilaiMaks}</td>
        <td class="aksi">
          <button class="edit" onclick="editMateri('${d.id}','${r.namaMateri}',${r.nilaiMaks})">✏️</button>
          <button class="hapus" onclick="hapusMateri('${d.id}','${r.namaMateri}')">❌</button>
        </td>
      </tr>
    `;
  });
  html += "</table>";
  listEl.innerHTML = html;
}

mapelEl.addEventListener("change", loadMateri);

/* TAMBAH MASSAL */
window.simpanMassal = async () => {
  const teks = document.getElementById("materi").value.trim();
  if (!teks) return;

  const baris = teks.split("\n");
  const mapelNama = mapelEl.options[mapelEl.selectedIndex].text;

  for (const b of baris) {
    if (!b.includes("|")) continue;
    const [nama, nilai] = b.split("|");

    await addDoc(collection(db,"materi_hafalan"), {
      mapelId: mapelEl.value,
      mapelNama,
      namaMateri: nama.trim(),
      nilaiMaks: Number(nilai),
      aktif: true,
      dibuat: new Date()
    });
  }

  document.getElementById("materi").value = "";
  loadMateri();
};

/* EDIT */
window.editMateri = (id, nama, nilai) => {
  editId = id;
  document.getElementById("editNama").value = nama;
  document.getElementById("editNilai").value = nilai;

  editBox.style.display = "block";
  tambahBox.style.display = "none";
};

window.updateMateri = async () => {
  await updateDoc(doc(db,"materi_hafalan",editId), {
    namaMateri: document.getElementById("editNama").value.trim(),
    nilaiMaks: Number(document.getElementById("editNilai").value)
  });

  batalEdit();
  loadMateri();
};

window.batalEdit = () => {
  editId = null;
  editBox.style.display = "none";
  tambahBox.style.display = "block";
};

/* DELETE */
window.hapusMateri = async (id, nama) => {
  if (!confirm(`Hapus materi "${nama}" ?`)) return;
  await deleteDoc(doc(db,"materi_hafalan",id));
  loadMateri();
};

loadMapel();
</script>

</body>
</html>
