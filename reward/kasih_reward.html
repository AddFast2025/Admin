<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Reward Siswa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
.card{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:12px}

h2{text-align:center;margin:0}
h3{text-align:center;color:#1976d2}

input, select, button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}

button{
  background:#1976d2;
  color:#fff;
  border:none;
  cursor:pointer;
}

button:hover{
  background:#125ea2;
}

/* ===== TABEL ===== */
#tabelSiswa{
  margin-top:10px;
  border-collapse:collapse;
}

#tabelSiswa th{
  background:#1976d2;
  color:white;
  padding:10px;
}

#tabelSiswa td{
  padding:8px;
}

#tabelSiswa tr:nth-child(even){
  background:#f5f5f5;
}

#tabelSiswa td:nth-child(1),
#tabelSiswa td:nth-child(3){
  text-align:center;
}

input[type="checkbox"]{
  width:18px;
  height:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

  <h2>🎁 REWARD SISWA</h2>

  <!-- INPUT KODE -->
  <div id="inputKode">
    <input id="kodeLembaga" placeholder="Masukkan kode lembaga (contoh: sb)">
    <button onclick="cekKode()">OK</button>
  </div>

  <!-- HALAMAN UTAMA -->
  <div id="halamanUtama" style="display:none">

    <h3 id="namaLembaga"></h3>

    <select id="pilihKelas"></select>
    <select id="pilihRombel"></select>

    <!-- TABEL -->
    <table id="tabelSiswa" border="1" width="100%">
      <thead>
        <tr>
          <th width="20">Cek</th>
          <th>Nama Siswa</th>
          <th width="30">Point</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <hr>

    <select id="jumlahReward">
      <option value="1">Reward 1</option>
      <option value="2">Reward 2</option>
     
    </select>

<!-- INPUT GURU -->
<input id="namaGuru" placeholder="Nama Guru">

<!-- INPUT KETERANGAN -->
<input id="keteranganReward" placeholder="Keterangan Reward (contoh: membantu teman)">

    <button onclick="kirimReward()">🎁 Simpan Reward</button>

  </div>

</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore, collection, getDocs,
  query, where, addDoc, serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain: "datasiswa-c10f4.firebaseapp.com",
  projectId: "datasiswa-c10f4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= GLOBAL ================= */
let lembagaId = "";

/* ================= AUTO LOAD ================= */
window.onload = function(){
  const saved = localStorage.getItem("lembagaKode");
  if(saved){
    document.getElementById("kodeLembaga").value = saved;
  }
};

/* ================= CEK KODE ================= */
window.cekKode = async function(){
  const kode = document.getElementById("kodeLembaga").value.trim();

  if(!kode){
    alert("Masukkan kode lembaga");
    return;
  }

  const snap = await getDocs(query(
    collection(db,"lembaga"),
    where("kode","==",kode)
  ));

  if(snap.empty){
    alert("Kode tidak ditemukan");
    return;
  }

  const docData = snap.docs[0];

  lembagaId = docData.id;
  localStorage.setItem("lembagaKode", kode);

  document.getElementById("inputKode").style.display="none";
  document.getElementById("halamanUtama").style.display="block";

  document.getElementById("namaLembaga").innerText =
    "" + docData.data().nama;

  loadKelas();
};

/* ================= LOAD KELAS ================= */
async function loadKelas(){
  const snap = await getDocs(query(
    collection(db,"kelas"),
    where("lembagaId","==",lembagaId)
  ));

  const select = document.getElementById("pilihKelas");
  select.innerHTML = "<option value=''>Pilih Kelas</option>";

  const data = [];

  snap.forEach(d=>{
    data.push({
      id: d.id,
      nama: d.data().nama
    });
  });

  data.sort((a,b)=>parseInt(a.nama) - parseInt(b.nama));

  data.forEach(k=>{
    select.innerHTML += `<option value="${k.id}">${k.nama}</option>`;
  });
}

/* ================= LOAD ROMBEL ================= */
document.getElementById("pilihKelas").onchange = loadRombel;

async function loadRombel(){
  const kelasId = document.getElementById("pilihKelas").value;
  if(!kelasId) return;

  const snap = await getDocs(query(
    collection(db,"rombel"),
    where("lembagaId","==",lembagaId),
    where("kelasId","==",kelasId)
  ));

  const select = document.getElementById("pilihRombel");
  select.innerHTML = "<option value=''>Pilih Rombel</option>";

  snap.forEach(d=>{
    select.innerHTML += `<option value="${d.id}">${d.data().nama}</option>`;
  });
}

/* ================= LOAD SISWA ================= */
document.getElementById("pilihRombel").onchange = loadSiswa;

async function loadSiswa(){
  const kelasId = document.getElementById("pilihKelas").value;
  const rombelId = document.getElementById("pilihRombel").value;

  if(!kelasId || !rombelId) return;

  const tbody = document.querySelector("#tabelSiswa tbody");
  tbody.innerHTML = "Memuat...";

  const now = new Date();
  const bulan = now.getMonth() + 1;
  const tahun = now.getFullYear();

  // ambil siswa
  const siswaSnap = await getDocs(query(
    collection(db,"siswa"),
    where("kelasId","==",kelasId),
    where("rombelId","==",rombelId)
  ));

  const siswaList = [];

  siswaSnap.forEach(d=>{
    siswaList.push({
      id: d.id,
      nama: d.data().nama
    });
  });

  // ambil reward bulan ini
  const rewardSnap = await getDocs(query(
    collection(db,"reward_siswa"),
    where("lembagaId","==",lembagaId),
    where("bulan","==",bulan),
    where("tahun","==",tahun)
  ));

  const poinMap = {};

  rewardSnap.forEach(d=>{
    const r = d.data();
    poinMap[r.siswaId] = (poinMap[r.siswaId] || 0) + (r.poin || 0);
  });

  // sort nama
  siswaList.sort((a,b)=>
    a.nama.toLowerCase().localeCompare(b.nama.toLowerCase())
  );

  // render
  tbody.innerHTML = "";

  siswaList.forEach(s=>{
    const poin = poinMap[s.id] || 0;

    tbody.innerHTML += `
      <tr>
        <td>
          <input type="checkbox"
            value="${s.id}"
            data-nama="${s.nama}">
        </td>
        <td>${s.nama}</td>
        <td><b>${poin}</b></td>
      </tr>
    `;
  });
}

/* ================= SIMPAN REWARD ================= */

window.kirimReward = async function(){

  const checked = document.querySelectorAll("#tabelSiswa input:checked");

  // 🔥 AMBIL DULU
  const namaGuru = document.getElementById("namaGuru").value.trim();
  const keterangan = document.getElementById("keteranganReward").value.trim();

  // 🔥 VALIDASI
  if(!namaGuru){
    alert("Isi nama guru dulu");
    return;
  }

  if(checked.length === 0){
    alert("Pilih siswa dulu");
    return;
  }

  const poin = parseInt(document.getElementById("jumlahReward").value);

  const now = new Date();
  const tanggal = now.toLocaleDateString("en-CA");
  const bulan = now.getMonth() + 1;
  const tahun = now.getFullYear();

  for(const cb of checked){
    await addDoc(collection(db,"reward_siswa"),{
      lembagaId,
      siswaId: cb.value,
      namaSiswa: cb.dataset.nama,
      kelasId: document.getElementById("pilihKelas").value,
      rombelId: document.getElementById("pilihRombel").value,
      poin,
      tanggal,
      bulan,
      tahun,

      // 🔥 DATA BARU
      namaGuru,
      keterangan,

      dibuat: serverTimestamp()
    });
  }

  alert("✅ Reward berhasil disimpan");

  loadSiswa();
};



</script>

</body>
</html>
