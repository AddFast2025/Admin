<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Lapor Subuh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial;
  background:#f4f6f8;
  padding:20px
}
.card{
  max-width:720px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px
}
h2,h3{text-align:center}

label{font-weight:bold}
input{width:100%;padding:6px;margin:6px 0}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px
}
th,td{
  border:1px solid #ddd;
  padding:6px
}
th{
  background:#1565c0;
  color:#fff
}
.center{text-align:center}

.btn{
  background:#2e7d32;
  color:#fff;
  border:none;
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
  margin:10px 0
}

/* === PAGE BREAK UNTUK PDF === */
.page-break{
  page-break-before: always;
}

/* sembunyikan kontrol saat PDF */
@media print{
  .no-print{display:none}
  body{background:#fff;padding:0}
  .card{border-radius:0}
}
</style>
</head>

<body>

<div class="card" id="areaCetak">

  <h2>📊 Dashboard Lapor Subuh</h2>

  <!-- KONTROL -->
  <div class="no-print">
    <label>Pilih Tanggal</label>
    <input type="date" id="tanggal">
    <button class="btn" onclick="downloadPDF()">⬇️ Download PDF</button>
  </div>

  <!-- ================= HALAMAN 1 ================= -->
  <h3>🏆 10 Siswa Paling Awal</h3>
  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Nama Siswa</th>
        <th>Pukul</th>
      </tr>
    </thead>
    <tbody id="topBody">
      <tr><td colspan="3" class="center">Memuat...</td></tr>
    </tbody>
  </table>

  <!-- ===== PAKSA HALAMAN BARU DI PDF ===== -->
  <div class="page-break"></div>

  <!-- ================= HALAMAN 2 ================= -->
  <h3>🏆 Ranking Semua Kelas</h3>
  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Kelas – Lembaga</th>
        <th>%</th>
      </tr>
    </thead>
    <tbody id="kelasBody">
      <tr><td colspan="3" class="center">Memuat...</td></tr>
    </tbody>
  </table>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, query, where, getDocs
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyD8SIXXPm_c-TJiaRjHbrishFtU2NICm9M",
  authDomain:"datasiswa-c10f4.firebaseapp.com",
  projectId:"datasiswa-c10f4"
});
const db=getFirestore(app);

const topBody=document.getElementById("topBody");
const kelasBody=document.getElementById("kelasBody");
const tanggalEl=document.getElementById("tanggal");

tanggalEl.value=new Date().toLocaleDateString("en-CA");

/* TOP 10 SISWA */
async function loadTop(){
  const snap=await getDocs(
    query(collection(db,"lapor_subuh"),
    where("tanggal","==",tanggalEl.value))
  );
  let data=[];
  snap.forEach(d=>data.push(d.data()));

  if(!data.length){
    topBody.innerHTML=`<tr><td colspan="3" class="center">Tidak ada data</td></tr>`;
    return;
  }

  data.sort((a,b)=>a.jam.localeCompare(b.jam));
  data=data.slice(0,10);

  topBody.innerHTML=data.map((r,i)=>`
    <tr>
      <td class="center">${i+1}</td>
      <td>${r.nama}<br><small>${r.kelasNama}${r.rombelNama} – ${r.lembagaNama}</small></td>
      <td class="center">${r.jam}</td>
    </tr>
  `).join("");
}

/* RANKING KELAS */
async function loadKelas(){
  const siswaSnap=await getDocs(collection(db,"siswa"));
  const total={};
  siswaSnap.forEach(d=>{
    total[d.data().rombelId]=(total[d.data().rombelId]||0)+1;
  });

  const laporSnap=await getDocs(
    query(collection(db,"lapor_subuh"),
    where("tanggal","==",tanggalEl.value))
  );

  const hadir={},info={};
  laporSnap.forEach(d=>{
    const r=d.data();
    hadir[r.rombelId]=hadir[r.rombelId]||new Set();
    hadir[r.rombelId].add(r.siswaId);
    info[r.rombelId]={nama:`${r.kelasNama}${r.rombelNama} – ${r.lembagaNama}`};
  });

  const hasil=[];
  for(const id in total){
    if(!info[id]) continue;
    const h=hadir[id]?.size||0;
    const p=((h/total[id])*100).toFixed(1);
    hasil.push({nama:info[id].nama,hadir:h,total:total[id],persen:p});
  }

  hasil.sort((a,b)=>b.persen-a.persen);

  kelasBody.innerHTML=hasil.map((r,i)=>`
    <tr>
      <td class="center">${i+1}</td>
      <td>${r.nama}<br><small>${r.hadir}/${r.total}</small></td>
      <td class="center">${r.persen}%</td>
    </tr>
  `).join("");
}

tanggalEl.onchange=()=>{
  loadTop();
  loadKelas();
};

loadTop();
loadKelas();
</script>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
function downloadPDF(){
  html2pdf().set({
    margin: [10, 10, 10, 10], // atas, kanan, bawah, kiri (mm)
    filename: `Lapor-Subuh-${tanggal.value}.pdf`,
    html2canvas: { scale: 2 },
    jsPDF: {
      unit: 'mm',
      format: [120, 300],   // 15 x 27 cm
      orientation: 'portrait'
    }
  }).from(document.getElementById("areaCetak")).save();
}
</script>

</body>
</html>
